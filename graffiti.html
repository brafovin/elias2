<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graffiti Train Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    user-select: none;
  }
  #gameCanvas {
    display: block;
    cursor: crosshair;
  }
  #paintCanvas {
    position: absolute;
    top: 0; left: 0;
    cursor: crosshair;
    pointer-events: none;
  }
  #uiCanvas {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
  }
  #colorMenu {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    border: 2px solid #e94560;
    border-radius: 12px;
    padding: 20px;
    z-index: 100;
    box-shadow: 0 0 40px rgba(233,69,96,0.4), inset 0 0 20px rgba(0,0,0,0.5);
    min-width: 340px;
  }
  #colorMenu h2 {
    color: #e94560;
    text-align: center;
    font-size: 18px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 15px;
    text-shadow: 0 0 10px rgba(233,69,96,0.8);
  }
  .color-grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 3px;
    margin-bottom: 15px;
  }
  .color-swatch {
    width: 18px;
    height: 18px;
    border-radius: 3px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.1s, border-color 0.1s;
  }
  .color-swatch:hover {
    transform: scale(1.2);
    border-color: #fff;
  }
  .color-swatch.selected {
    border-color: #fff;
    transform: scale(1.15);
    box-shadow: 0 0 8px rgba(255,255,255,0.6);
  }
  .menu-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    color: #aaa;
    font-size: 13px;
  }
  .menu-row label {
    min-width: 90px;
    color: #ccc;
  }
  input[type=range] {
    flex: 1;
    accent-color: #e94560;
    cursor: pointer;
  }
  #brushSizeVal {
    min-width: 25px;
    color: #e94560;
    font-weight: bold;
  }
  .tool-buttons {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .tool-btn {
    flex: 1;
    padding: 8px;
    border: 2px solid #333;
    border-radius: 6px;
    background: #111;
    color: #aaa;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    transition: all 0.15s;
  }
  .tool-btn:hover { border-color: #e94560; color: #fff; }
  .tool-btn.active {
    border-color: #e94560;
    background: rgba(233,69,96,0.2);
    color: #e94560;
  }
  #closeMenuBtn {
    width: 100%;
    padding: 8px;
    background: rgba(233,69,96,0.15);
    border: 1px solid #e94560;
    border-radius: 6px;
    color: #e94560;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    transition: background 0.15s;
  }
  #closeMenuBtn:hover { background: rgba(233,69,96,0.3); }
  #currentColorPreview {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 0 10px rgba(255,255,255,0.3);
    flex-shrink: 0;
  }
  .opacity-section {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    color: #ccc;
    font-size: 13px;
  }
  .opacity-section label { min-width: 90px; }
  #opacityVal { min-width: 30px; color: #e94560; font-weight: bold; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<canvas id="paintCanvas"></canvas>
<canvas id="uiCanvas"></canvas>

<div id="colorMenu">
  <h2>// Farbmenü //</h2>
  <div class="menu-row" style="justify-content:center; margin-bottom:14px;">
    <div id="currentColorPreview"></div>
    <span style="color:#ccc; font-size:12px; margin-left:10px;">Aktuelle Farbe</span>
  </div>
  <div class="color-grid" id="colorGrid"></div>
  <div class="tool-buttons">
    <button class="tool-btn active" id="btnSpray" onclick="setTool('spray')">Spray</button>
    <button class="tool-btn" id="btnEraser" onclick="setTool('eraser')">Radierer</button>
  </div>
  <div class="menu-row">
    <label>Pinselgröße:</label>
    <input type="range" id="brushSize" min="5" max="60" value="18">
    <span id="brushSizeVal">18</span>
  </div>
  <div class="opacity-section">
    <label>Deckkraft:</label>
    <input type="range" id="opacitySlider" min="10" max="100" value="70">
    <span id="opacityVal">70</span>%
  </div>
  <button id="closeMenuBtn" onclick="toggleMenu()">[ SCHLIESSEN ]</button>
</div>

<script>
const gameCanvas = document.getElementById('gameCanvas');
const paintCanvas = document.getElementById('paintCanvas');
const uiCanvas = document.getElementById('uiCanvas');
const gc = gameCanvas.getContext('2d');
const pc = paintCanvas.getContext('2d');
const uc = uiCanvas.getContext('2d');

let W = window.innerWidth;
let H = window.innerHeight;

gameCanvas.width = paintCanvas.width = uiCanvas.width = W;
gameCanvas.height = paintCanvas.height = uiCanvas.height = H;

// State
let tool = 'spray';
let brushSize = 18;
let paintOpacity = 0.70;
let isDrawing = false;
let menuOpen = false;
let selectedColor = '#ff2200';
let trainRegion = { x: 0, y: 0, w: 0, h: 0 };

// Color palette
const colors = [
  '#ff0000','#ff3300','#ff6600','#ff9900','#ffcc00','#ffff00',
  '#ccff00','#99ff00','#66ff00','#33ff00',
  '#00ff00','#00ff33','#00ff66','#00ff99','#00ffcc','#00ffff',
  '#00ccff','#0099ff','#0066ff','#0033ff',
  '#0000ff','#3300ff','#6600ff','#9900ff','#cc00ff','#ff00ff',
  '#ff00cc','#ff0099','#ff0066','#ff0033',
  '#ffffff','#dddddd','#aaaaaa','#888888','#555555','#222222',
  '#ff8080','#80ff80','#8080ff','#ffff80',
  '#ff80ff','#80ffff','#ffa040','#40a0ff','#ff4080','#80ff40',
  '#c0a000','#a000c0','#00a0c0','#c00040',
  '#ffe0c0','#c0e0ff','#ffc0e0','#e0ffc0',
  '#400000','#004000','#000040','#404000',
  '#ff6666','#66ff66','#6666ff','#ffaa66',
  '#aa66ff','#66ffaa','#ffdd44','#44ddff',
  '#ff44dd','#44ffdd','#ff8844','#44ff88',
  '#8844ff','#88ff44','#ff4488','#4488ff',
  '#ff2266','#66ff22','#2266ff','#ff6622',
  '#6622ff','#22ff66','#ffcc44','#44ccff',
  '#ff44cc','#44ffcc','#cc44ff','#ccff44',
  '#ff0044','#44ff00','#0044ff','#ff4400',
  '#4400ff','#00ff44','#aaff00','#00aaff',
  '#ff00aa','#ffaa00','#00ffaa','#aa00ff',
  '#ff5500','#00ff55','#5500ff','#ff0055',
  '#55ff00','#0055ff','#ffbb00','#00bbff',
  '#ff00bb','#bbff00','#00ffbb','#bb00ff',
];

// Build color grid
const grid = document.getElementById('colorGrid');
colors.forEach((c, i) => {
  const sw = document.createElement('div');
  sw.className = 'color-swatch' + (c === selectedColor ? ' selected' : '');
  sw.style.background = c;
  sw.title = c;
  sw.addEventListener('click', () => {
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
    sw.classList.add('selected');
    selectedColor = c;
    document.getElementById('currentColorPreview').style.background = c;
    setTool('spray');
  });
  grid.appendChild(sw);
});
document.getElementById('currentColorPreview').style.background = selectedColor;

// Brush size
document.getElementById('brushSize').addEventListener('input', function() {
  brushSize = +this.value;
  document.getElementById('brushSizeVal').textContent = brushSize;
});

// Opacity
document.getElementById('opacitySlider').addEventListener('input', function() {
  paintOpacity = +this.value / 100;
  document.getElementById('opacityVal').textContent = this.value;
});

function setTool(t) {
  tool = t;
  document.getElementById('btnSpray').classList.toggle('active', t === 'spray');
  document.getElementById('btnEraser').classList.toggle('active', t === 'eraser');
}

function toggleMenu() {
  menuOpen = !menuOpen;
  document.getElementById('colorMenu').style.display = menuOpen ? 'block' : 'none';
  drawUI();
}

// ---- Drawing the scene ----

function drawBackground() {
  // Sky gradient
  const skyGrad = gc.createLinearGradient(0, 0, 0, H * 0.65);
  skyGrad.addColorStop(0, '#050510');
  skyGrad.addColorStop(0.5, '#0d0d2b');
  skyGrad.addColorStop(1, '#1a1a3a');
  gc.fillStyle = skyGrad;
  gc.fillRect(0, 0, W, H * 0.65);

  // Stars
  gc.fillStyle = 'rgba(255,255,255,0.7)';
  const stars = [
    [0.05,0.04],[0.12,0.09],[0.22,0.03],[0.35,0.07],[0.48,0.02],[0.58,0.08],
    [0.70,0.04],[0.81,0.10],[0.90,0.03],[0.95,0.07],[0.15,0.15],[0.28,0.18],
    [0.42,0.12],[0.55,0.19],[0.67,0.13],[0.78,0.17],[0.88,0.11],[0.03,0.22],
    [0.18,0.25],[0.32,0.28],[0.46,0.23],[0.60,0.27],[0.74,0.21],[0.85,0.26],
    [0.97,0.14],[0.09,0.30],[0.25,0.33],[0.38,0.31],[0.52,0.35],[0.64,0.29],
  ];
  stars.forEach(([sx,sy]) => {
    const r = Math.random() < 0.2 ? 1.5 : 1;
    gc.beginPath();
    gc.arc(sx*W, sy*H*0.6, r, 0, Math.PI*2);
    gc.fill();
  });

  // Moon
  gc.save();
  gc.fillStyle = '#ffe8a0';
  gc.shadowColor = '#ffe060';
  gc.shadowBlur = 20;
  gc.beginPath();
  gc.arc(W*0.88, H*0.1, 28, 0, Math.PI*2);
  gc.fill();
  gc.fillStyle = '#0d0d2b';
  gc.beginPath();
  gc.arc(W*0.88+12, H*0.1-6, 24, 0, Math.PI*2);
  gc.fill();
  gc.restore();

  // Buildings silhouette
  gc.fillStyle = '#080818';
  const buildings = [
    {x:0.00, y:0.30, w:0.06, h:0.35},
    {x:0.04, y:0.20, w:0.04, h:0.45},
    {x:0.07, y:0.28, w:0.05, h:0.37},
    {x:0.11, y:0.15, w:0.03, h:0.50},
    {x:0.13, y:0.24, w:0.04, h:0.41},
    {x:0.16, y:0.32, w:0.06, h:0.33},
    {x:0.21, y:0.22, w:0.04, h:0.43},
    {x:0.64, y:0.18, w:0.05, h:0.47},
    {x:0.68, y:0.25, w:0.04, h:0.40},
    {x:0.71, y:0.12, w:0.03, h:0.53},
    {x:0.73, y:0.28, w:0.06, h:0.37},
    {x:0.78, y:0.20, w:0.04, h:0.45},
    {x:0.81, y:0.30, w:0.05, h:0.35},
    {x:0.85, y:0.16, w:0.04, h:0.49},
    {x:0.88, y:0.26, w:0.05, h:0.39},
    {x:0.92, y:0.22, w:0.06, h:0.43},
    {x:0.97, y:0.30, w:0.03, h:0.35},
  ];
  buildings.forEach(b => {
    gc.fillRect(b.x*W, b.y*H, b.w*W, b.h*H);
    // Windows
    gc.fillStyle = 'rgba(255,220,80,0.25)';
    for(let wy = b.y*H + 10; wy < (b.y+b.h)*H - 10; wy += 16) {
      for(let wx = b.x*W + 5; wx < (b.x+b.w)*W - 5; wx += 10) {
        if(Math.random() < 0.45) {
          gc.fillRect(wx, wy, 5, 7);
        }
      }
    }
    gc.fillStyle = '#080818';
  });

  // Ground
  const groundGrad = gc.createLinearGradient(0, H*0.65, 0, H);
  groundGrad.addColorStop(0, '#1a1510');
  groundGrad.addColorStop(1, '#0a0a08');
  gc.fillStyle = groundGrad;
  gc.fillRect(0, H*0.65, W, H*0.35);

  // Tracks
  const trackY = H * 0.83;
  gc.strokeStyle = '#555';
  gc.lineWidth = 3;
  gc.beginPath(); gc.moveTo(0, trackY); gc.lineTo(W, trackY); gc.stroke();
  gc.beginPath(); gc.moveTo(0, trackY + 14); gc.lineTo(W, trackY + 14); gc.stroke();

  // Rail ties
  gc.strokeStyle = '#3a3028';
  gc.lineWidth = 6;
  for(let tx = 0; tx < W; tx += 32) {
    gc.beginPath();
    gc.moveTo(tx, trackY - 2);
    gc.lineTo(tx, trackY + 16);
    gc.stroke();
  }

  // Ground grime / debris
  gc.fillStyle = 'rgba(255,200,100,0.04)';
  for(let i = 0; i < 60; i++) {
    gc.fillRect(Math.random()*W, trackY+18 + Math.random()*(H-trackY-18), Math.random()*30+5, 1);
  }
}

function drawTrain() {
  const trainY = H * 0.30;
  const trainH = H * 0.55;
  const trainX = W * 0.01;
  const trainW = W * 0.98;
  const wagonCount = 4;
  const gap = 8;
  const wagonW = (trainW - gap*(wagonCount-1)) / wagonCount;

  // Store for hit testing
  trainRegion = { x: trainX, y: trainY, w: trainW, h: trainH * 0.78 };

  for(let i = 0; i < wagonCount; i++) {
    const wx = trainX + i * (wagonW + gap);
    drawWagon(wx, trainY, wagonW, trainH);
  }

  // Locomotive (first wagon gets a cab)
  drawLocomotive(trainX, trainY, wagonW, trainH);
}

function drawWagon(x, y, w, h) {
  const bodyH = h * 0.78;
  const radius = 8;

  // Body shadow
  gc.fillStyle = 'rgba(0,0,0,0.4)';
  gc.fillRect(x+4, y+6, w, bodyH);

  // Body
  gc.save();
  gc.shadowColor = 'rgba(0,0,0,0.5)';
  gc.shadowBlur = 10;
  roundRect(gc, x, y, w, bodyH, radius);
  const bodyGrad = gc.createLinearGradient(x, y, x, y+bodyH);
  bodyGrad.addColorStop(0, '#c8cdd4');
  bodyGrad.addColorStop(0.15, '#e0e4ea');
  bodyGrad.addColorStop(0.5, '#d0d5dc');
  bodyGrad.addColorStop(0.85, '#b8bcc4');
  bodyGrad.addColorStop(1, '#909498');
  gc.fillStyle = bodyGrad;
  gc.fill();
  gc.restore();

  // Stripe at top
  gc.fillStyle = '#444';
  gc.fillRect(x+radius, y, w-radius*2, 7);

  // Windows row
  const winCount = Math.floor(w / 80);
  const winW = 52;
  const winH = 34;
  const winY = y + h*0.13;
  const winSpacing = (w - radius*2 - winW*winCount) / (winCount+1);
  for(let wi = 0; wi < winCount; wi++) {
    const wX = x + radius + winSpacing + wi*(winW + winSpacing);
    // Window frame
    gc.fillStyle = '#222';
    gc.fillRect(wX-3, winY-3, winW+6, winH+6);
    // Glass
    const glassGrad = gc.createLinearGradient(wX, winY, wX, winY+winH);
    glassGrad.addColorStop(0, '#1a2a3a');
    glassGrad.addColorStop(0.5, '#1e3a5f');
    glassGrad.addColorStop(1, '#0a1520');
    gc.fillStyle = glassGrad;
    gc.fillRect(wX, winY, winW, winH);
    // Reflection
    gc.fillStyle = 'rgba(255,255,255,0.06)';
    gc.fillRect(wX+3, winY+3, winW*0.3, winH*0.4);
  }

  // Door
  const doorW = 30;
  const doorH = bodyH * 0.55;
  const doorX = x + w/2 - doorW/2;
  const doorY = y + bodyH - doorH - 6;
  gc.fillStyle = '#888';
  gc.fillRect(doorX, doorY, doorW, doorH);
  gc.strokeStyle = '#555';
  gc.lineWidth = 1.5;
  gc.strokeRect(doorX+2, doorY+2, doorW-4, doorH-4);
  gc.fillStyle = '#aaa';
  gc.beginPath();
  gc.arc(doorX + doorW - 7, doorY + doorH/2, 3, 0, Math.PI*2);
  gc.fill();

  // Rivets / panel lines
  gc.strokeStyle = 'rgba(100,100,100,0.3)';
  gc.lineWidth = 1;
  gc.beginPath();
  gc.moveTo(x+radius, y + bodyH*0.5);
  gc.lineTo(x+w-radius, y + bodyH*0.5);
  gc.stroke();

  // Undercarriage
  gc.fillStyle = '#1a1a1a';
  gc.fillRect(x+4, y+bodyH, w-8, h*0.1);

  // Bogie (wheel assembly)
  drawBogieSet(x + w*0.2, y + bodyH + h*0.05, h);
  drawBogieSet(x + w*0.7, y + bodyH + h*0.05, h);
}

function drawBogieSet(cx, cy, trainH) {
  const axleW = 60;
  const wheelR = trainH * 0.08;

  // Axle bar
  gc.fillStyle = '#333';
  gc.fillRect(cx - axleW/2, cy, axleW, 5);

  // Wheels
  [-axleW/2 + wheelR, axleW/2 - wheelR].forEach(dx => {
    const wx = cx + dx;
    const wy = cy + wheelR + 2;

    // Wheel shadow
    gc.fillStyle = 'rgba(0,0,0,0.4)';
    gc.beginPath();
    gc.arc(wx+2, wy+2, wheelR, 0, Math.PI*2);
    gc.fill();

    // Wheel rim
    const rimGrad = gc.createRadialGradient(wx-wheelR*0.3, wy-wheelR*0.3, 1, wx, wy, wheelR);
    rimGrad.addColorStop(0, '#888');
    rimGrad.addColorStop(0.6, '#444');
    rimGrad.addColorStop(1, '#222');
    gc.fillStyle = rimGrad;
    gc.beginPath();
    gc.arc(wx, wy, wheelR, 0, Math.PI*2);
    gc.fill();

    // Hub
    gc.fillStyle = '#666';
    gc.beginPath();
    gc.arc(wx, wy, wheelR*0.35, 0, Math.PI*2);
    gc.fill();
    gc.fillStyle = '#999';
    gc.beginPath();
    gc.arc(wx, wy, wheelR*0.15, 0, Math.PI*2);
    gc.fill();

    // Spokes
    gc.strokeStyle = '#555';
    gc.lineWidth = 2;
    for(let s = 0; s < 6; s++) {
      const angle = (s / 6) * Math.PI * 2;
      gc.beginPath();
      gc.moveTo(wx + Math.cos(angle)*wheelR*0.15, wy + Math.sin(angle)*wheelR*0.15);
      gc.lineTo(wx + Math.cos(angle)*wheelR*0.85, wy + Math.sin(angle)*wheelR*0.85);
      gc.stroke();
    }

    // Rail flange
    gc.fillStyle = '#555';
    gc.beginPath();
    gc.arc(wx, wy, wheelR*1.1, Math.PI*0.3, Math.PI*0.7);
    gc.fill();
  });
}

function drawLocomotive(x, y, w, h) {
  // Cab nose / front shape
  const bodyH = h * 0.78;
  const noseW = 28;

  // Cab overhang
  gc.fillStyle = '#b0b4bc';
  gc.fillRect(x - noseW, y + bodyH*0.3, noseW, bodyH*0.5);

  // Cab face
  gc.strokeStyle = '#666';
  gc.lineWidth = 2;
  gc.strokeRect(x - noseW, y + bodyH*0.3, noseW, bodyH*0.5);

  // Headlight
  const hlY = y + bodyH*0.45;
  gc.save();
  gc.fillStyle = '#ffe060';
  gc.shadowColor = '#ffee88';
  gc.shadowBlur = 15;
  gc.beginPath();
  gc.arc(x - noseW/2, hlY, 8, 0, Math.PI*2);
  gc.fill();
  gc.restore();

  // Stripe on loco
  gc.fillStyle = '#cc2200';
  gc.fillRect(x, y + bodyH*0.62, w*0.6, 8);

  // Number plate
  gc.fillStyle = '#222';
  gc.fillRect(x + 15, y + bodyH*0.72, 55, 18);
  gc.fillStyle = '#ffcc00';
  gc.font = 'bold 12px Courier New';
  gc.textAlign = 'center';
  gc.fillText('5512', x + 42, y + bodyH*0.72 + 13);
}

function drawCharacter() {
  const charX = W * 0.27;
  const charY = H * 0.83 - 4;
  const scale = H / 600;

  gc.save();

  // Shadow
  gc.fillStyle = 'rgba(0,0,0,0.4)';
  gc.beginPath();
  gc.ellipse(charX, charY, 18*scale, 5*scale, 0, 0, Math.PI*2);
  gc.fill();

  // Sneakers
  gc.fillStyle = '#fff';
  gc.fillRect(charX - 14*scale, charY - 8*scale, 13*scale, 8*scale);
  gc.fillRect(charX + 2*scale, charY - 8*scale, 13*scale, 8*scale);
  gc.fillStyle = '#cc2200';
  gc.fillRect(charX - 14*scale, charY - 10*scale, 13*scale, 3*scale);
  gc.fillRect(charX + 2*scale, charY - 10*scale, 13*scale, 3*scale);

  // Pants (baggy)
  gc.fillStyle = '#1a1a4a';
  gc.fillRect(charX - 12*scale, charY - 38*scale, 26*scale, 30*scale);
  // Pant crease
  gc.strokeStyle = '#111';
  gc.lineWidth = 1.5*scale;
  gc.beginPath();
  gc.moveTo(charX, charY - 38*scale);
  gc.lineTo(charX, charY - 10*scale);
  gc.stroke();

  // Belt
  gc.fillStyle = '#333';
  gc.fillRect(charX - 12*scale, charY - 40*scale, 26*scale, 4*scale);
  gc.fillStyle = '#888';
  gc.fillRect(charX - 5*scale, charY - 41*scale, 10*scale, 6*scale);

  // Hoodie body
  gc.fillStyle = '#2a2a2a';
  gc.fillRect(charX - 13*scale, charY - 76*scale, 28*scale, 40*scale);

  // Hoodie pocket
  gc.fillStyle = '#1a1a1a';
  gc.fillRect(charX - 8*scale, charY - 52*scale, 16*scale, 12*scale);

  // Right arm (holding spray can - extended toward train)
  gc.fillStyle = '#2a2a2a';
  // Upper arm
  gc.save();
  gc.translate(charX + 13*scale, charY - 68*scale);
  gc.rotate(-0.4);
  gc.fillRect(-5*scale, 0, 10*scale, 22*scale);
  gc.restore();
  // Forearm
  gc.save();
  gc.translate(charX + 20*scale, charY - 54*scale);
  gc.rotate(-0.7);
  gc.fillRect(-4*scale, 0, 8*scale, 20*scale);
  gc.restore();

  // Left arm (casual)
  gc.fillStyle = '#2a2a2a';
  gc.save();
  gc.translate(charX - 13*scale, charY - 68*scale);
  gc.rotate(0.2);
  gc.fillRect(-5*scale, 0, 10*scale, 20*scale);
  gc.restore();

  // Spray can
  const canX = charX + 34*scale;
  const canY = charY - 42*scale;
  // Can body
  const canGrad = gc.createLinearGradient(canX-5*scale, canY, canX+5*scale, canY);
  canGrad.addColorStop(0, '#cc0000');
  canGrad.addColorStop(0.5, '#ff3300');
  canGrad.addColorStop(1, '#880000');
  gc.fillStyle = canGrad;
  gc.beginPath();
  gc.roundRect(canX - 5*scale, canY - 20*scale, 10*scale, 24*scale, 3*scale);
  gc.fill();
  // Can cap
  gc.fillStyle = '#fff';
  gc.beginPath();
  gc.roundRect(canX - 4*scale, canY - 24*scale, 8*scale, 6*scale, 2*scale);
  gc.fill();
  // Nozzle
  gc.fillStyle = '#ddd';
  gc.fillRect(canX + 4*scale, canY - 22*scale, 5*scale, 3*scale);

  // Spray burst
  gc.save();
  const sprayGrad = gc.createRadialGradient(canX+18*scale, canY-21*scale, 0, canX+18*scale, canY-21*scale, 14*scale);
  sprayGrad.addColorStop(0, 'rgba(255,50,0,0.6)');
  sprayGrad.addColorStop(0.5, 'rgba(255,100,0,0.25)');
  sprayGrad.addColorStop(1, 'rgba(255,150,50,0)');
  gc.fillStyle = sprayGrad;
  gc.beginPath();
  gc.arc(canX+18*scale, canY-21*scale, 14*scale, 0, Math.PI*2);
  gc.fill();
  gc.restore();

  // Head
  gc.fillStyle = '#c8a070';
  gc.beginPath();
  gc.arc(charX, charY - 84*scale, 14*scale, 0, Math.PI*2);
  gc.fill();

  // Beanie hat
  gc.fillStyle = '#cc2200';
  gc.beginPath();
  gc.arc(charX, charY - 88*scale, 14*scale, Math.PI, Math.PI*2);
  gc.fill();
  gc.fillRect(charX - 15*scale, charY - 90*scale, 30*scale, 8*scale);
  gc.fillStyle = '#aa0000';
  gc.fillRect(charX - 15*scale, charY - 90*scale, 30*scale, 4*scale);
  // Pompom
  gc.fillStyle = '#ff3322';
  gc.beginPath();
  gc.arc(charX, charY - 103*scale, 5*scale, 0, Math.PI*2);
  gc.fill();

  // Face
  gc.fillStyle = '#000';
  gc.beginPath();
  gc.arc(charX - 4*scale, charY - 84*scale, 2*scale, 0, Math.PI*2);
  gc.fill();
  gc.beginPath();
  gc.arc(charX + 4*scale, charY - 84*scale, 2*scale, 0, Math.PI*2);
  gc.fill();
  gc.strokeStyle = '#000';
  gc.lineWidth = 1.5;
  gc.beginPath();
  gc.arc(charX + 1*scale, charY - 79*scale, 4*scale, 0.1, Math.PI-0.1);
  gc.stroke();

  // Mask over lower face
  gc.fillStyle = '#333';
  gc.beginPath();
  gc.roundRect(charX - 8*scale, charY - 81*scale, 16*scale, 8*scale, 4*scale);
  gc.fill();

  gc.restore();
}

function drawUI() {
  uc.clearRect(0, 0, W, H);

  // Bottom hint bar
  const barH = 36;
  uc.fillStyle = 'rgba(0,0,0,0.7)';
  uc.fillRect(0, H - barH, W, barH);

  uc.fillStyle = 'rgba(233,69,96,0.9)';
  uc.font = 'bold 13px Courier New';
  uc.textAlign = 'left';
  uc.fillText('Ä = Farbmenü öffnen', 14, H - barH/2 + 5);

  // Color indicator
  const indX = W - 80;
  const indY = H - barH/2;
  uc.strokeStyle = '#fff';
  uc.lineWidth = 2;
  uc.beginPath();
  uc.arc(indX, indY, 12, 0, Math.PI*2);
  uc.stroke();
  uc.fillStyle = tool === 'eraser' ? '#333' : selectedColor;
  uc.beginPath();
  uc.arc(indX, indY, 10, 0, Math.PI*2);
  uc.fill();

  uc.fillStyle = 'rgba(255,255,255,0.5)';
  uc.font = '10px Courier New';
  uc.textAlign = 'right';
  uc.fillText(tool === 'eraser' ? 'RADIERER' : 'SPRAY', W - 20, H - barH/2 + 4);

  // Brush size indicator (small circle near bottom right)
  uc.strokeStyle = 'rgba(255,255,255,0.2)';
  uc.lineWidth = 1;
  uc.beginPath();
  uc.arc(W - 130, H - barH/2, brushSize/2 * 0.5 + 3, 0, Math.PI*2);
  uc.stroke();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function isOnTrain(x, y) {
  return x >= trainRegion.x && x <= trainRegion.x + trainRegion.w &&
         y >= trainRegion.y && y <= trainRegion.y + trainRegion.h;
}

function sprayPaint(x, y) {
  if(!isOnTrain(x, y)) return;

  if(tool === 'eraser') {
    pc.save();
    pc.globalCompositeOperation = 'destination-out';
    const eraserGrad = pc.createRadialGradient(x, y, 0, x, y, brushSize);
    eraserGrad.addColorStop(0, 'rgba(0,0,0,1)');
    eraserGrad.addColorStop(0.5, 'rgba(0,0,0,0.8)');
    eraserGrad.addColorStop(1, 'rgba(0,0,0,0)');
    pc.fillStyle = eraserGrad;
    pc.beginPath();
    pc.arc(x, y, brushSize, 0, Math.PI*2);
    pc.fill();
    pc.restore();
    return;
  }

  // Parse color
  const hex = selectedColor;
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);

  // Main spray blob
  pc.save();
  const grad = pc.createRadialGradient(x, y, 0, x, y, brushSize);
  grad.addColorStop(0, `rgba(${r},${g},${b},${paintOpacity})`);
  grad.addColorStop(0.4, `rgba(${r},${g},${b},${paintOpacity*0.6})`);
  grad.addColorStop(0.75, `rgba(${r},${g},${b},${paintOpacity*0.2})`);
  grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
  pc.fillStyle = grad;
  pc.beginPath();
  pc.arc(x, y, brushSize, 0, Math.PI*2);
  pc.fill();

  // Scatter dots (spray effect)
  const dotCount = Math.floor(brushSize * 0.8);
  for(let i = 0; i < dotCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * brushSize * 1.2;
    const dx = x + Math.cos(angle) * dist;
    const dy = y + Math.sin(angle) * dist;
    if(!isOnTrain(dx, dy)) continue;
    const alpha = Math.random() * paintOpacity * 0.5;
    const dsize = Math.random() * 2.5 + 0.5;
    pc.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    pc.beginPath();
    pc.arc(dx, dy, dsize, 0, Math.PI*2);
    pc.fill();
  }
  pc.restore();
}

// Input
paintCanvas.style.pointerEvents = 'auto';

paintCanvas.addEventListener('mousedown', e => {
  if(menuOpen) return;
  isDrawing = true;
  sprayPaint(e.clientX, e.clientY);
});
paintCanvas.addEventListener('mousemove', e => {
  if(!isDrawing || menuOpen) return;
  sprayPaint(e.clientX, e.clientY);
});
paintCanvas.addEventListener('mouseup', () => { isDrawing = false; });
paintCanvas.addEventListener('mouseleave', () => { isDrawing = false; });

// Touch support
paintCanvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if(menuOpen) return;
  isDrawing = true;
  const t = e.touches[0];
  sprayPaint(t.clientX, t.clientY);
}, {passive:false});
paintCanvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if(!isDrawing || menuOpen) return;
  const t = e.touches[0];
  sprayPaint(t.clientX, t.clientY);
}, {passive:false});
paintCanvas.addEventListener('touchend', () => { isDrawing = false; });

document.addEventListener('keydown', e => {
  if(e.key === 'Ä' || e.key === 'ä' || e.keyCode === 196 || e.keyCode === 228) {
    toggleMenu();
    e.preventDefault();
  }
  if(e.key === 'Escape' && menuOpen) {
    toggleMenu();
  }
});

// Initial render
function render() {
  gc.clearRect(0, 0, W, H);
  drawBackground();
  drawTrain();
  drawCharacter();
  drawUI();
}

// Resize handler
window.addEventListener('resize', () => {
  W = window.innerWidth;
  H = window.innerHeight;
  gameCanvas.width = uiCanvas.width = W;
  gameCanvas.height = uiCanvas.height = H;
  // Keep paint canvas but resize (this clears it — a tradeoff)
  // To preserve: copy to temp, resize, restore
  const tmp = document.createElement('canvas');
  tmp.width = paintCanvas.width;
  tmp.height = paintCanvas.height;
  tmp.getContext('2d').drawImage(paintCanvas, 0, 0);
  paintCanvas.width = W;
  paintCanvas.height = H;
  pc.drawImage(tmp, 0, 0);
  render();
});

render();
</script>
</body>
</html>
