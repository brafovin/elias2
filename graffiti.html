<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graffiti Train Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    user-select: none;
  }
  #gameCanvas {
    display: block;
    cursor: crosshair;
  }
  #paintCanvas {
    position: absolute;
    top: 0; left: 0;
    cursor: crosshair;
    pointer-events: none;
  }
  #uiCanvas {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
  }
  #colorMenu {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    border: 2px solid #e94560;
    border-radius: 12px;
    padding: 20px;
    z-index: 100;
    box-shadow: 0 0 40px rgba(233,69,96,0.4), inset 0 0 20px rgba(0,0,0,0.5);
    min-width: 340px;
  }
  #colorMenu h2 {
    color: #e94560;
    text-align: center;
    font-size: 18px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 15px;
    text-shadow: 0 0 10px rgba(233,69,96,0.8);
  }
  .color-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 3px;
    margin-bottom: 15px;
  }
  .color-swatch {
    width: 11px;
    height: 11px;
    border-radius: 2px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.1s, border-color 0.1s;
  }
  .color-swatch:hover {
    transform: scale(1.2);
    border-color: #fff;
  }
  .color-swatch.selected {
    border-color: #fff;
    transform: scale(1.15);
    box-shadow: 0 0 8px rgba(255,255,255,0.6);
  }
  .menu-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    color: #aaa;
    font-size: 13px;
  }
  .menu-row label {
    min-width: 90px;
    color: #ccc;
  }
  input[type=range] {
    flex: 1;
    accent-color: #e94560;
    cursor: pointer;
  }
  #brushSizeVal {
    min-width: 25px;
    color: #e94560;
    font-weight: bold;
  }
  .tool-buttons {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .tool-btn {
    flex: 1;
    padding: 8px;
    border: 2px solid #333;
    border-radius: 6px;
    background: #111;
    color: #aaa;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    transition: all 0.15s;
  }
  .tool-btn:hover { border-color: #e94560; color: #fff; }
  .tool-btn.active {
    border-color: #e94560;
    background: rgba(233,69,96,0.2);
    color: #e94560;
  }
  #closeMenuBtn {
    width: 100%;
    padding: 8px;
    background: rgba(233,69,96,0.15);
    border: 1px solid #e94560;
    border-radius: 6px;
    color: #e94560;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    transition: background 0.15s;
  }
  #closeMenuBtn:hover { background: rgba(233,69,96,0.3); }
  #currentColorPreview {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 0 10px rgba(255,255,255,0.3);
    flex-shrink: 0;
  }
  .opacity-section {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    color: #ccc;
    font-size: 13px;
  }
  .opacity-section label { min-width: 90px; }
  #opacityVal { min-width: 30px; color: #e94560; font-weight: bold; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<canvas id="paintCanvas"></canvas>
<canvas id="uiCanvas"></canvas>

<div id="colorMenu">
  <h2>// Farbmenü //</h2>
  <div class="menu-row" style="justify-content:center; margin-bottom:14px;">
    <div id="currentColorPreview"></div>
    <span style="color:#ccc; font-size:12px; margin-left:10px;">Aktuelle Farbe</span>
  </div>
  <div class="color-grid" id="colorGrid"></div>
  <div class="tool-buttons">
    <button class="tool-btn active" id="btnSpray" onclick="setTool('spray')">Spray</button>
    <button class="tool-btn" id="btnBlock" onclick="setTool('block')">Block</button>
    <button class="tool-btn" id="btnEraser" onclick="setTool('eraser')">Radierer</button>
  </div>
  <div class="menu-row">
    <label>Pinselgröße:</label>
    <input type="range" id="brushSize" min="5" max="60" value="18">
    <span id="brushSizeVal">18</span>
  </div>
  <div class="opacity-section">
    <label>Deckkraft:</label>
    <input type="range" id="opacitySlider" min="10" max="100" value="70">
    <span id="opacityVal">70</span>%
  </div>
  <button id="clearAllBtn" onclick="clearAllPaint()" style="width:100%;padding:8px;background:rgba(233,69,96,0.08);border:1px solid #e94560;border-radius:6px;color:#e94560;cursor:pointer;font-family:'Courier New',monospace;font-size:12px;letter-spacing:2px;margin-bottom:8px;transition:background 0.15s;" onmouseover="this.style.background='rgba(233,69,96,0.25)'" onmouseout="this.style.background='rgba(233,69,96,0.08)'">[ ZEICHNUNG LÖSCHEN ]</button>
  <button id="closeMenuBtn" onclick="toggleMenu()">[ SCHLIESSEN ]</button>
</div>

<script>
const gameCanvas = document.getElementById('gameCanvas');
const paintCanvas = document.getElementById('paintCanvas');
const uiCanvas = document.getElementById('uiCanvas');
const gc = gameCanvas.getContext('2d');
const pc = paintCanvas.getContext('2d');
const uc = uiCanvas.getContext('2d');

let W = window.innerWidth;
let H = window.innerHeight;

gameCanvas.width = paintCanvas.width = uiCanvas.width = W;
gameCanvas.height = paintCanvas.height = uiCanvas.height = H;

// State
let tool = 'spray';
let brushSize = 18;
let paintOpacity = 0.70;
let isDrawing = false;
let sprayX = 0, sprayY = 0;
let targetX = 0, targetY = 0;
let mouseX = 0, mouseY = 0;
let sprayRAF = null;
let blockStart = null; // {x,y} when block drag starts
const LERP = 1.0;
let menuOpen = false;
let selectedColor = '#ff2200';
let trainRegion = { x: 0, y: 0, w: 0, h: 0 };

// Color palette
const colors = [
  '#ff0000','#ff6600','#ffcc00','#ffff00','#ccff00',
  '#00ff00','#00ffcc','#00ffff','#0099ff','#0000ff',
  '#6600ff','#cc00ff','#ff00ff','#ff0066','#ff0033',
  '#ffffff','#aaaaaa','#555555','#222222','#000000',
  '#ff8080','#ffa040','#80ff80','#80ffff','#8080ff',
  '#ff80ff','#c0a000','#00a0c0','#a000c0','#884400',
];

// Build color grid
const grid = document.getElementById('colorGrid');
colors.forEach((c, i) => {
  const sw = document.createElement('div');
  sw.className = 'color-swatch' + (c === selectedColor ? ' selected' : '');
  sw.style.background = c;
  sw.title = c;
  sw.addEventListener('click', () => {
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
    sw.classList.add('selected');
    selectedColor = c;
    document.getElementById('currentColorPreview').style.background = c;
    setTool('spray');
  });
  grid.appendChild(sw);
});
document.getElementById('currentColorPreview').style.background = selectedColor;

// Brush size
document.getElementById('brushSize').addEventListener('input', function() {
  brushSize = +this.value;
  document.getElementById('brushSizeVal').textContent = brushSize;
});

// Opacity
document.getElementById('opacitySlider').addEventListener('input', function() {
  paintOpacity = +this.value / 100;
  document.getElementById('opacityVal').textContent = this.value;
});

function placeBlock(x1, y1, x2, y2) {
  const lx = Math.min(x1, x2), ly = Math.min(y1, y2);
  const rw = Math.abs(x2 - x1), rh = Math.abs(y2 - y1);
  if(rw < 2 || rh < 2) return;
  // Clamp to train region
  const cx = Math.max(lx, trainRegion.x);
  const cy = Math.max(ly, trainRegion.y);
  const cw = Math.min(lx + rw, trainRegion.x + trainRegion.w) - cx;
  const ch = Math.min(ly + rh, trainRegion.y + trainRegion.h) - cy;
  if(cw <= 0 || ch <= 0) return;
  const hex = selectedColor;
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  pc.fillStyle = `rgba(${r},${g},${b},${paintOpacity})`;
  pc.fillRect(cx, cy, cw, ch);
}

function clearAllPaint() {
  pc.clearRect(0, 0, W, H);
}

function setTool(t) {
  tool = t;
  document.getElementById('btnSpray').classList.toggle('active', t === 'spray');
  document.getElementById('btnBlock').classList.toggle('active', t === 'block');
  document.getElementById('btnEraser').classList.toggle('active', t === 'eraser');
}

function toggleMenu() {
  menuOpen = !menuOpen;
  document.getElementById('colorMenu').style.display = menuOpen ? 'block' : 'none';
  drawUI();
}

// ---- Drawing the scene ----

// Seeded pseudo-random for deterministic building features
function seededRand(seed) {
  let s = seed;
  return function() {
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    return (s >>> 0) / 0xffffffff;
  };
}

// Draw a water tower on top of a building
function drawWaterTower(gc, bx, by, bw) {
  const tx = bx + bw * 0.5;
  const ty = by;
  gc.fillStyle = '#2a2030';
  // Tank barrel
  gc.beginPath();
  gc.ellipse(tx, ty - 18, 9, 5, 0, 0, Math.PI*2);
  gc.fill();
  gc.fillRect(tx - 9, ty - 18, 18, 18);
  gc.fillStyle = '#1a1520';
  gc.beginPath();
  gc.ellipse(tx, ty, 9, 5, 0, 0, Math.PI*2);
  gc.fill();
  // Legs
  gc.strokeStyle = '#222';
  gc.lineWidth = 1.5;
  [[-7,10],[0,12],[7,10]].forEach(([dx,dy]) => {
    gc.beginPath(); gc.moveTo(tx+dx, ty); gc.lineTo(tx+dx*0.5, ty+dy); gc.stroke();
  });
  // Roof cone
  gc.fillStyle = '#333';
  gc.beginPath();
  gc.moveTo(tx - 10, ty - 18);
  gc.lineTo(tx + 10, ty - 18);
  gc.lineTo(tx, ty - 28);
  gc.closePath();
  gc.fill();
}

// Draw AC unit on rooftop
function drawACUnit(gc, bx, by, bw) {
  const ax = bx + bw * 0.7;
  const ay = by - 8;
  gc.fillStyle = '#1e1e2a';
  gc.fillRect(ax, ay, 18, 8);
  gc.strokeStyle = '#333';
  gc.lineWidth = 1;
  gc.strokeRect(ax, ay, 18, 8);
  // Vent lines
  gc.strokeStyle = '#444';
  gc.lineWidth = 0.5;
  for(let vx = ax+3; vx < ax+16; vx+=3) {
    gc.beginPath(); gc.moveTo(vx, ay+1); gc.lineTo(vx, ay+7); gc.stroke();
  }
}

// Draw a glowing neon billboard on a building
function drawNeonBillboard(gc, bx, by, bw) {
  const bBx = bx + bw * 0.05;
  const bBy = by + 12;
  const bBw = bw * 0.9;
  const bBh = 22;
  gc.save();
  // Billboard backing
  gc.fillStyle = '#111118';
  gc.fillRect(bBx, bBy, bBw, bBh);
  gc.strokeStyle = '#223';
  gc.lineWidth = 1;
  gc.strokeRect(bBx, bBy, bBw, bBh);
  // Neon glow border
  gc.shadowColor = 'rgba(0,200,255,0.9)';
  gc.shadowBlur = 14;
  gc.strokeStyle = 'rgba(0,180,255,0.8)';
  gc.lineWidth = 1.5;
  gc.strokeRect(bBx+2, bBy+2, bBw-4, bBh-4);
  // Neon text lines (abstract)
  gc.fillStyle = 'rgba(0,210,255,0.7)';
  gc.fillRect(bBx+5, bBy+5, bBw*0.55, 3);
  gc.shadowColor = 'rgba(255,80,0,0.9)';
  gc.fillStyle = 'rgba(255,100,20,0.75)';
  gc.fillRect(bBx+5, bBy+12, bBw*0.35, 3);
  gc.restore();
}

function drawBackground() {
  // Sky gradient — deep urban night
  const skyGrad = gc.createLinearGradient(0, 0, 0, H * 0.68);
  skyGrad.addColorStop(0, '#020208');
  skyGrad.addColorStop(0.4, '#08081e');
  skyGrad.addColorStop(0.8, '#121228');
  skyGrad.addColorStop(1, '#1c1830');
  gc.fillStyle = skyGrad;
  gc.fillRect(0, 0, W, H * 0.68);

  // Urban light pollution glow on horizon
  const horizonGlow = gc.createLinearGradient(0, H * 0.42, 0, H * 0.68);
  horizonGlow.addColorStop(0, 'rgba(0,0,0,0)');
  horizonGlow.addColorStop(0.5, 'rgba(60,20,10,0.12)');
  horizonGlow.addColorStop(0.8, 'rgba(120,50,10,0.22)');
  horizonGlow.addColorStop(1, 'rgba(180,80,20,0.35)');
  gc.fillStyle = horizonGlow;
  gc.fillRect(0, H * 0.42, W, H * 0.26);

  // Purple secondary glow
  const purpleGlow = gc.createLinearGradient(0, H * 0.50, 0, H * 0.68);
  purpleGlow.addColorStop(0, 'rgba(0,0,0,0)');
  purpleGlow.addColorStop(1, 'rgba(60,20,80,0.18)');
  gc.fillStyle = purpleGlow;
  gc.fillRect(0, H * 0.50, W, H * 0.18);

  // Stars with varying brightness and subtle twinkle (alpha varies by position)
  const starData = [
    [0.05,0.04,1.8,0.7],[0.12,0.09,1.2,0.5],[0.22,0.03,2.0,0.9],[0.35,0.07,1.0,0.4],[0.48,0.02,1.5,0.6],[0.58,0.08,1.1,0.5],
    [0.70,0.04,1.8,0.8],[0.81,0.10,1.3,0.6],[0.90,0.03,1.0,0.4],[0.95,0.07,1.6,0.7],[0.15,0.15,1.2,0.5],[0.28,0.18,0.9,0.4],
    [0.42,0.12,1.4,0.6],[0.55,0.19,1.0,0.4],[0.67,0.13,1.7,0.75],[0.78,0.17,1.1,0.5],[0.88,0.11,0.8,0.35],[0.03,0.22,1.3,0.55],
    [0.18,0.25,1.0,0.45],[0.32,0.28,1.5,0.65],[0.46,0.23,1.2,0.5],[0.60,0.27,0.9,0.38],[0.74,0.21,1.6,0.7],[0.85,0.26,1.0,0.42],
    [0.97,0.14,1.4,0.6],[0.09,0.30,1.1,0.48],[0.25,0.33,0.8,0.35],[0.38,0.31,1.3,0.55],[0.52,0.35,1.0,0.42],[0.64,0.29,1.5,0.65],
  ];
  // Twinkle offset: use star position as a seed for a slight alpha variation
  const now = Date.now() * 0.001;
  starData.forEach(([sx,sy,sr,baseAlpha]) => {
    // Deterministic twinkle based on position seed
    const twinkle = Math.sin(now * (0.4 + sx * 1.3) + sy * 17.3) * 0.12;
    const alpha = Math.max(0.15, Math.min(1.0, baseAlpha + twinkle));
    gc.save();
    gc.fillStyle = `rgba(255,255,255,${alpha})`;
    gc.shadowColor = sr > 1.5 ? '#ccccff' : 'transparent';
    gc.shadowBlur = sr > 1.5 ? 5 : 0;
    gc.beginPath();
    gc.arc(sx*W, sy*H*0.62, sr*0.7, 0, Math.PI*2);
    gc.fill();
    gc.restore();
  });

  // Moon with glow halo and crater shadows
  gc.save();
  const moonX = W*0.88, moonY = H*0.09, moonR = 30;
  const moonGlow = gc.createRadialGradient(moonX, moonY, moonR, moonX, moonY, moonR*3.5);
  moonGlow.addColorStop(0, 'rgba(255,230,120,0.20)');
  moonGlow.addColorStop(0.5, 'rgba(255,200,80,0.07)');
  moonGlow.addColorStop(1, 'rgba(255,180,60,0)');
  gc.fillStyle = moonGlow;
  gc.beginPath();
  gc.arc(moonX, moonY, moonR*3.5, 0, Math.PI*2);
  gc.fill();
  // Moon body
  gc.fillStyle = '#ffe9a8';
  gc.shadowColor = '#ffe060';
  gc.shadowBlur = 20;
  gc.beginPath();
  gc.arc(moonX, moonY, moonR, 0, Math.PI*2);
  gc.fill();
  gc.shadowBlur = 0;
  // Shadow bite (phase)
  gc.fillStyle = '#08081e';
  gc.beginPath();
  gc.arc(moonX+13, moonY-7, 26, 0, Math.PI*2);
  gc.fill();
  // Craters (visible on lit part, clipped to moon)
  gc.globalCompositeOperation = 'source-atop';
  gc.save();
  gc.beginPath(); gc.arc(moonX, moonY, moonR, 0, Math.PI*2); gc.clip();
  const craters = [[moonX-8, moonY+10, 5], [moonX+14, moonY+5, 3], [moonX-2, moonY-12, 4], [moonX+8, moonY-8, 2.5]];
  craters.forEach(([cx,cy,cr]) => {
    // Dark shadow side of crater
    gc.fillStyle = 'rgba(160,130,50,0.35)';
    gc.beginPath(); gc.arc(cx, cy, cr, 0, Math.PI*2); gc.fill();
    // Light rim
    gc.fillStyle = 'rgba(255,245,180,0.45)';
    gc.beginPath(); gc.arc(cx-cr*0.3, cy-cr*0.3, cr*0.6, 0, Math.PI*2); gc.fill();
  });
  gc.restore();
  gc.globalCompositeOperation = 'source-over';
  gc.restore();

  // Buildings — layered depth (far/mid/near)
  const buildingLayers = [
    { color: '#0a0a1a', winColor: 'rgba(255,200,80,0.12)', list: [
      {x:0.00,y:0.22,w:0.07,h:0.46,slant:0},{x:0.06,y:0.14,w:0.05,h:0.54,slant:0},
      {x:0.64,y:0.16,w:0.06,h:0.52,slant:0},{x:0.88,y:0.18,w:0.07,h:0.50,slant:0},
    ]},
    { color: '#0f0f20', winColor: 'rgba(255,200,80,0.20)', list: [
      {x:0.04,y:0.26,w:0.05,h:0.42,slant:0},{x:0.10,y:0.18,w:0.04,h:0.50,slant:3},
      {x:0.13,y:0.28,w:0.06,h:0.40,slant:0},{x:0.18,y:0.20,w:0.04,h:0.48,slant:0},
      {x:0.70,y:0.22,w:0.05,h:0.46,slant:4},{x:0.74,y:0.14,w:0.03,h:0.54,slant:0},
      {x:0.77,y:0.26,w:0.06,h:0.42,slant:0},{x:0.82,y:0.20,w:0.04,h:0.48,slant:3},
      {x:0.93,y:0.24,w:0.05,h:0.44,slant:0},{x:0.97,y:0.28,w:0.03,h:0.40,slant:0},
    ]},
    { color: '#161626', winColor: 'rgba(255,210,100,0.30)', list: [
      {x:0.00,y:0.32,w:0.04,h:0.36,slant:0},{x:0.21,y:0.24,w:0.04,h:0.44,slant:0},
      {x:0.25,y:0.30,w:0.03,h:0.38,slant:5},{x:0.65,y:0.30,w:0.04,h:0.38,slant:0},
      {x:0.86,y:0.28,w:0.04,h:0.40,slant:0},{x:0.96,y:0.32,w:0.04,h:0.36,slant:0},
    ]},
  ];

  // Index for deterministic building features
  let bldgIdx = 0;
  buildingLayers.forEach((layer, layerIdx) => {
    layer.list.forEach((b, bIdx) => {
      const rand = seededRand(layerIdx * 100 + bIdx * 7 + 42);
      const bx = b.x*W, by = b.y*H, bw = b.w*W, bh = b.h*H;

      // Building body with slight gradient
      const bGrad = gc.createLinearGradient(bx, by, bx + bw, by);
      bGrad.addColorStop(0, layer.color);
      bGrad.addColorStop(1, shadeColor(layer.color, 10));
      gc.fillStyle = bGrad;

      // Slanted roof variation
      const slant = (b.slant || 0);
      if(slant > 0) {
        gc.beginPath();
        gc.moveTo(bx, by + slant);      // top-left (lower)
        gc.lineTo(bx + bw, by);          // top-right (higher)
        gc.lineTo(bx + bw, by + bh);
        gc.lineTo(bx, by + bh);
        gc.closePath();
        gc.fill();
      } else {
        gc.fillRect(bx, by, bw, bh);
      }

      // Subtle city light ambient glow near building base
      const baseGlow = gc.createLinearGradient(bx, by + bh - 20, bx, by + bh + 12);
      baseGlow.addColorStop(0, 'rgba(180,90,20,0)');
      baseGlow.addColorStop(1, 'rgba(180,90,20,0.12)');
      gc.fillStyle = baseGlow;
      gc.fillRect(bx, by + bh - 20, bw, 32);

      // Windows with slight randomness — warm vs cool tints
      for(let wy = by + 8; wy < by + bh - 8; wy += 14) {
        for(let wx = bx + 5; wx < bx + bw - 5; wx += 9) {
          const r2 = rand();
          if(r2 < 0.40) {
            const warm = rand() > 0.5;
            gc.fillStyle = warm
              ? layer.winColor.replace('rgba(255,200,80,', 'rgba(255,200,80,')
              : layer.winColor.replace('rgba(255,200,80,', 'rgba(180,210,255,');
            gc.fillRect(wx, wy, 5, 7);
            if(rand() < 0.15) {
              gc.fillStyle = warm ? 'rgba(255,240,120,0.5)' : 'rgba(160,200,255,0.45)';
              gc.fillRect(wx+1, wy+1, 3, 5);
            }
          }
        }
      }

      // Rooftop details: antenna, water tower, AC unit
      const roofFeature = rand();
      if(roofFeature < 0.3) {
        // Antenna
        gc.fillStyle = '#333';
        gc.fillRect(bx + bw*0.4, by - 14, 2, 14);
        gc.fillStyle = '#555';
        gc.beginPath();
        gc.arc(bx + bw*0.4 + 1, by - 16, 4, 0, Math.PI*2);
        gc.fill();
      } else if(roofFeature < 0.55) {
        drawWaterTower(gc, bx, by, bw);
      } else if(roofFeature < 0.72) {
        drawACUnit(gc, bx, by, bw);
      }

      // Neon billboard on one mid-layer building
      if(layerIdx === 1 && bIdx === 3) {
        drawNeonBillboard(gc, bx, by, bw);
      }

      bldgIdx++;
    });
  });

  // Distant fog/haze at building tops — soft gradient band
  const hazeGrad = gc.createLinearGradient(0, H * 0.25, 0, H * 0.42);
  hazeGrad.addColorStop(0, 'rgba(0,0,0,0)');
  hazeGrad.addColorStop(0.5, 'rgba(20,15,30,0.08)');
  hazeGrad.addColorStop(1, 'rgba(40,25,50,0.18)');
  gc.fillStyle = hazeGrad;
  gc.fillRect(0, H * 0.25, W, H * 0.17);

  // Street lamp posts
  [0.05, 0.30, 0.55, 0.80, 0.95].forEach(lx => {
    const lampX = lx * W;
    const lampY = H * 0.68;
    gc.strokeStyle = '#444';
    gc.lineWidth = 3;
    gc.beginPath();
    gc.moveTo(lampX, lampY);
    gc.lineTo(lampX, lampY - H*0.16);
    gc.lineTo(lampX + 18, lampY - H*0.16);
    gc.stroke();
    // Lamp glow
    gc.save();
    const lampGlow = gc.createRadialGradient(lampX+18, lampY - H*0.16, 0, lampX+18, lampY - H*0.16, 60);
    lampGlow.addColorStop(0, 'rgba(255,200,80,0.6)');
    lampGlow.addColorStop(0.3, 'rgba(255,180,60,0.20)');
    lampGlow.addColorStop(0.7, 'rgba(255,160,40,0.07)');
    lampGlow.addColorStop(1, 'rgba(255,140,20,0)');
    gc.fillStyle = lampGlow;
    gc.fillRect(lampX - 42, lampY - H*0.16 - 60, 120, 120);
    gc.fillStyle = '#ffe090';
    gc.shadowColor = '#ffcc44';
    gc.shadowBlur = 14;
    gc.beginPath();
    gc.arc(lampX + 18, lampY - H*0.16, 5, 0, Math.PI*2);
    gc.fill();
    gc.restore();
  });

  // Ground — asphalt texture
  const groundGrad = gc.createLinearGradient(0, H*0.68, 0, H);
  groundGrad.addColorStop(0, '#1e1a14');
  groundGrad.addColorStop(0.3, '#161410');
  groundGrad.addColorStop(1, '#080806');
  gc.fillStyle = groundGrad;
  gc.fillRect(0, H*0.68, W, H*0.32);

  // Wet asphalt sheen under train area — blue-gray reflection strip
  const wetSheen = gc.createLinearGradient(0, H*0.68, 0, H*0.82);
  wetSheen.addColorStop(0, 'rgba(40,50,70,0.22)');
  wetSheen.addColorStop(0.5, 'rgba(30,40,60,0.12)');
  wetSheen.addColorStop(1, 'rgba(0,0,0,0)');
  gc.fillStyle = wetSheen;
  gc.fillRect(0, H*0.68, W, H*0.14);

  // Train shadow on ground
  const trainShadowGrad = gc.createLinearGradient(0, H*0.79, 0, H*0.84);
  trainShadowGrad.addColorStop(0, 'rgba(0,0,0,0.32)');
  trainShadowGrad.addColorStop(1, 'rgba(0,0,0,0)');
  gc.fillStyle = trainShadowGrad;
  gc.fillRect(0, H*0.79, W, H*0.05);

  // Asphalt cracks
  gc.strokeStyle = 'rgba(0,0,0,0.5)';
  gc.lineWidth = 1;
  [[0.1,0.75,0.18,0.80],[0.3,0.72,0.35,0.78],[0.6,0.74,0.67,0.82],[0.8,0.76,0.85,0.80]].forEach(([x1,y1,x2,y2]) => {
    gc.beginPath(); gc.moveTo(x1*W,y1*H); gc.lineTo(x2*W,y2*H); gc.stroke();
  });

  // Small debris/trash near tracks
  const debrisRand = seededRand(99);
  for(let d = 0; d < 18; d++) {
    const dx = debrisRand() * W;
    const dy = H*0.80 + debrisRand() * H*0.04;
    const dw = debrisRand() * 6 + 2;
    const dh = debrisRand() * 3 + 1;
    const dangle = (debrisRand() - 0.5) * 0.6;
    gc.save();
    gc.translate(dx, dy);
    gc.rotate(dangle);
    gc.fillStyle = `rgba(${120+debrisRand()*60},${100+debrisRand()*40},${60+debrisRand()*30},${0.3+debrisRand()*0.3})`;
    gc.fillRect(-dw/2, -dh/2, dw, dh);
    gc.restore();
  }

  // Ballast / gravel between tracks
  gc.fillStyle = '#2a2420';
  gc.fillRect(0, H*0.82, W, H*0.06);
  // Gravel dots — more scattered
  const grRand = seededRand(77);
  for(let i = 0; i < 300; i++) {
    const gx = grRand()*W, gy = H*0.82 + grRand()*H*0.06;
    const gs = grRand()*4+1;
    gc.fillStyle = `rgba(${80+grRand()*50},${70+grRand()*35},${55+grRand()*25},${0.4+grRand()*0.4})`;
    gc.fillRect(gx, gy, gs, gs*0.7);
  }

  // Rail tracks — steel with highlight
  const trackY = H * 0.84;
  [0, 18].forEach(offset => {
    const railGrad = gc.createLinearGradient(0, trackY+offset, 0, trackY+offset+6);
    railGrad.addColorStop(0, '#aaa');
    railGrad.addColorStop(0.4, '#888');
    railGrad.addColorStop(1, '#444');
    gc.fillStyle = railGrad;
    gc.fillRect(0, trackY+offset, W, 6);
  });

  // Rail ties — wooden sleepers with grain
  for(let tx = 0; tx < W; tx += 28) {
    const tieGrad = gc.createLinearGradient(tx, trackY-4, tx+8, trackY-4);
    tieGrad.addColorStop(0, '#4a3820');
    tieGrad.addColorStop(0.5, '#5a4828');
    tieGrad.addColorStop(1, '#3a2818');
    gc.fillStyle = tieGrad;
    gc.fillRect(tx, trackY - 5, 8, 30);
    gc.strokeStyle = 'rgba(0,0,0,0.3)';
    gc.lineWidth = 0.5;
    gc.beginPath(); gc.moveTo(tx+2, trackY-4); gc.lineTo(tx+2, trackY+26); gc.stroke();
    gc.beginPath(); gc.moveTo(tx+5, trackY-4); gc.lineTo(tx+5, trackY+26); gc.stroke();
  }

  // Ground puddles — larger, reflect orange street lamp glow
  gc.save();
  const puddleData = [[0.12,0.905,70,16],[0.38,0.888,55,13],[0.62,0.912,80,18],[0.80,0.895,50,12],[0.50,0.870,40,10]];
  puddleData.forEach(([px,py,pw,ph]) => {
    const pudX = px*W, pudY = py*H;
    // Puddle base (dark reflective)
    const puddle = gc.createRadialGradient(pudX, pudY, 0, pudX, pudY, pw);
    puddle.addColorStop(0, 'rgba(60,80,100,0.55)');
    puddle.addColorStop(0.4, 'rgba(40,55,80,0.35)');
    puddle.addColorStop(0.8, 'rgba(20,30,50,0.18)');
    puddle.addColorStop(1, 'rgba(0,0,0,0)');
    gc.fillStyle = puddle;
    gc.beginPath();
    gc.ellipse(pudX, pudY, pw, ph, 0, 0, Math.PI*2);
    gc.fill();
    // Orange street-lamp reflection inside puddle
    const lampRefl = gc.createRadialGradient(pudX, pudY - ph*0.3, 0, pudX, pudY, pw*0.6);
    lampRefl.addColorStop(0, 'rgba(255,160,40,0.22)');
    lampRefl.addColorStop(0.5, 'rgba(200,100,20,0.10)');
    lampRefl.addColorStop(1, 'rgba(0,0,0,0)');
    gc.fillStyle = lampRefl;
    gc.beginPath();
    gc.ellipse(pudX, pudY, pw*0.6, ph*0.6, 0, 0, Math.PI*2);
    gc.fill();
    // Specular highlight edge
    gc.fillStyle = 'rgba(255,255,255,0.06)';
    gc.beginPath();
    gc.ellipse(pudX - pw*0.2, pudY - ph*0.25, pw*0.3, ph*0.2, -0.3, 0, Math.PI*2);
    gc.fill();
  });
  gc.restore();
}

function shadeColor(hex, amt) {
  const n = parseInt(hex.slice(1),16);
  const r = Math.min(255,(n>>16)+amt);
  const g = Math.min(255,((n>>8)&0xff)+amt);
  const b = Math.min(255,(n&0xff)+amt);
  return `rgb(${r},${g},${b})`;
}

function drawTrain() {
  const trackY = H * 0.84;
  const trainH = H * 1.05;
  // Wheel bottom must land exactly on trackY:
  // bogieY = trainY + trainH*0.52 - 6
  // wheelBottom = bogieY + wheelR*1.4, wheelR = trainH*0.038
  // => trainY = trackY - trainH*(0.52 + 0.038*1.4) + 6
  const trainY = trackY - trainH * 0.5732 + 6;
  const trainX = W * 0.00;
  const trainW = W * 1.00;
  const wagonCount = 9;
  const gap = 8;
  const wagonW = (trainW - gap*(wagonCount-1)) / wagonCount;

  // Store for hit testing
  trainRegion = { x: trainX, y: trainY, w: trainW, h: trainH * 0.78 };

  for(let i = 0; i < wagonCount; i++) {
    const wx = trainX + i * (wagonW + gap);
    drawWagon(wx, trainY, wagonW, trainH);
  }

  // Locomotive (first wagon gets a cab)
  drawLocomotive(trainX, trainY, wagonW, trainH);
}

function drawWagon(x, y, w, h) {
  const bodyH = h * 0.52;
  const radius = 6;

  // --- Drop shadow ---
  gc.save();
  gc.shadowColor = 'rgba(0,0,0,0.6)';
  gc.shadowBlur = 20;
  gc.shadowOffsetY = 10;
  roundRect(gc, x, y, w, bodyH, radius);
  gc.fillStyle = '#000';
  gc.fill();
  gc.restore();

  // --- Main body: smooth white/light-gray gradient ---
  gc.save();
  roundRect(gc, x, y, w, bodyH, radius);
  const bodyGrad = gc.createLinearGradient(x, y, x, y + bodyH);
  bodyGrad.addColorStop(0,    '#d0d4d8'); // silver roof
  bodyGrad.addColorStop(0.08, '#e8ecf0'); // upper highlight
  bodyGrad.addColorStop(0.20, '#f4f6f8'); // bright upper body
  bodyGrad.addColorStop(0.55, '#edf0f3'); // mid body
  bodyGrad.addColorStop(0.80, '#dde0e4'); // lower body
  bodyGrad.addColorStop(1,    '#c8ccd0'); // bottom
  gc.fillStyle = bodyGrad;
  gc.fill();

  // Horizontal side sheen
  const sheenGrad = gc.createLinearGradient(x, y, x + w, y);
  sheenGrad.addColorStop(0,    'rgba(255,255,255,0)');
  sheenGrad.addColorStop(0.25, 'rgba(255,255,255,0.10)');
  sheenGrad.addColorStop(0.5,  'rgba(255,255,255,0.18)');
  sheenGrad.addColorStop(0.75, 'rgba(255,255,255,0.08)');
  sheenGrad.addColorStop(1,    'rgba(255,255,255,0)');
  gc.fillStyle = sheenGrad;
  roundRect(gc, x, y, w, bodyH, radius);
  gc.fill();
  gc.restore();

  // --- Roof metallic sheen (top 12%) ---
  gc.save();
  gc.beginPath();
  gc.moveTo(x + radius, y);
  gc.lineTo(x + w - radius, y);
  gc.quadraticCurveTo(x + w, y, x + w, y + radius);
  gc.lineTo(x + w, y + bodyH * 0.12);
  gc.lineTo(x, y + bodyH * 0.12);
  gc.lineTo(x, y + radius);
  gc.quadraticCurveTo(x, y, x + radius, y);
  gc.closePath();
  const roofGrad = gc.createLinearGradient(x, y, x + w, y);
  roofGrad.addColorStop(0,    'rgba(180,188,200,0.7)');
  roofGrad.addColorStop(0.4,  'rgba(220,228,238,0.5)');
  roofGrad.addColorStop(0.6,  'rgba(240,245,252,0.7)');
  roofGrad.addColorStop(1,    'rgba(190,198,210,0.6)');
  gc.fillStyle = roofGrad;
  gc.fill();
  gc.restore();

  // --- Red ICE stripe at ~60% body height ---
  const stripeY = y + bodyH * 0.60;
  const stripeH = 9;
  gc.fillStyle = '#e8000f';
  gc.fillRect(x, stripeY, w, stripeH);
  // Stripe highlight edge
  gc.fillStyle = 'rgba(255,80,80,0.35)';
  gc.fillRect(x, stripeY, w, 2);
  gc.fillStyle = 'rgba(100,0,0,0.3)';
  gc.fillRect(x, stripeY + stripeH - 2, w, 2);

  // --- Windows: single row, thin rectangular, above red stripe ---
  const winCount = Math.max(2, Math.floor(w / 78));
  const winW = Math.min(52, (w - 20) / winCount - 10);
  const winH = bodyH * 0.22;
  const winY = y + bodyH * 0.22;
  const totalWinW = winCount * winW;
  const winSpacing = (w - totalWinW) / (winCount + 1);
  for(let wi = 0; wi < winCount; wi++) {
    const wX = x + winSpacing + wi * (winW + winSpacing);
    // Rubber/dark frame
    gc.fillStyle = '#2a2e36';
    gc.fillRect(wX - 3, winY - 3, winW + 6, winH + 6);
    // Dark blue glass
    const glassGrad = gc.createLinearGradient(wX, winY, wX, winY + winH);
    glassGrad.addColorStop(0,   '#0d1e35');
    glassGrad.addColorStop(0.3, '#142840');
    glassGrad.addColorStop(0.7, '#0e1f38');
    glassGrad.addColorStop(1,   '#080f1c');
    gc.fillStyle = glassGrad;
    gc.fillRect(wX, winY, winW, winH);
    // Interior warm glow
    gc.fillStyle = 'rgba(255,220,150,0.05)';
    gc.fillRect(wX + 2, winY + winH * 0.45, winW - 4, winH * 0.5);
    // Window reflection
    gc.fillStyle = 'rgba(255,255,255,0.12)';
    gc.fillRect(wX + 3, winY + 2, winW * 0.22, winH * 0.6);
    gc.fillStyle = 'rgba(255,255,255,0.06)';
    gc.fillRect(wX + winW * 0.65, winY + 2, winW * 0.18, winH * 0.4);
  }

  // --- Gray underbody skirt ---
  const skirtY = y + bodyH * 0.88;
  const skirtH = bodyH * 0.12;
  gc.save();
  gc.beginPath();
  gc.moveTo(x, skirtY);
  gc.lineTo(x + w, skirtY);
  gc.lineTo(x + w, y + bodyH - radius);
  gc.quadraticCurveTo(x + w, y + bodyH, x + w - radius, y + bodyH);
  gc.lineTo(x + radius, y + bodyH);
  gc.quadraticCurveTo(x, y + bodyH, x, y + bodyH - radius);
  gc.closePath();
  const skirtGrad = gc.createLinearGradient(x, skirtY, x, y + bodyH);
  skirtGrad.addColorStop(0, '#5a5e64');
  skirtGrad.addColorStop(1, '#3a3e44');
  gc.fillStyle = skirtGrad;
  gc.fill();
  gc.restore();

  // --- Ventilation grilles on lower skirt ---
  gc.save();
  gc.strokeStyle = 'rgba(0,0,0,0.45)';
  gc.lineWidth = 1;
  const grillY = skirtY + skirtH * 0.2;
  const grillH = skirtH * 0.6;
  const grillSpacing = w * 0.12;
  for(let gx = x + grillSpacing * 0.5; gx < x + w - grillSpacing*0.3; gx += grillSpacing) {
    const grillW = grillSpacing * 0.55;
    gc.strokeRect(gx, grillY, grillW, grillH);
    // Horizontal slats
    for(let gl = 1; gl < 4; gl++) {
      gc.beginPath();
      gc.moveTo(gx, grillY + grillH * gl/4);
      gc.lineTo(gx + grillW, grillY + grillH * gl/4);
      gc.stroke();
    }
  }
  gc.restore();

  // --- Dirt streaks along bottom of wagon ---
  gc.save();
  gc.globalAlpha = 0.18;
  const streakRand = seededRand(Math.round(x));
  for(let si = 0; si < 6; si++) {
    const sx = x + streakRand() * w;
    const sy = y + bodyH * (0.70 + streakRand() * 0.18);
    const sheight = bodyH * (0.08 + streakRand() * 0.14);
    const sw2 = 2 + streakRand() * 4;
    const streakGrad = gc.createLinearGradient(sx, sy, sx, sy + sheight);
    streakGrad.addColorStop(0, 'rgba(80,55,30,0)');
    streakGrad.addColorStop(0.4, `rgba(70,48,22,${0.5 + streakRand()*0.3})`);
    streakGrad.addColorStop(1, 'rgba(50,35,15,0)');
    gc.fillStyle = streakGrad;
    gc.fillRect(sx - sw2/2, sy, sw2, sheight);
  }
  gc.globalAlpha = 1;
  gc.restore();

  // --- Faint wet-metal reflection on lower body (ground/lamp light) ---
  gc.save();
  const reflGrad = gc.createLinearGradient(x, y + bodyH * 0.75, x, y + bodyH);
  reflGrad.addColorStop(0, 'rgba(60,80,100,0)');
  reflGrad.addColorStop(0.5, 'rgba(50,70,95,0.07)');
  reflGrad.addColorStop(1, 'rgba(40,60,85,0.13)');
  gc.fillStyle = reflGrad;
  gc.fillRect(x, y + bodyH * 0.75, w, bodyH * 0.25);
  gc.restore();

  // --- Warm street-lamp tint on lower body ---
  gc.save();
  const lampTint = gc.createLinearGradient(x, y + bodyH * 0.60, x, y + bodyH);
  lampTint.addColorStop(0, 'rgba(255,160,40,0)');
  lampTint.addColorStop(1, 'rgba(255,140,30,0.06)');
  gc.fillStyle = lampTint;
  gc.fillRect(x, y + bodyH * 0.60, w, bodyH * 0.40);
  gc.restore();

  // --- Number/ID plate ---
  const plateX = x + w * 0.08;
  const plateY = skirtY + 2;
  const plateW = Math.min(74, w * 0.28);
  const plateH = 10;
  gc.fillStyle = '#4a4e54';
  gc.fillRect(plateX, plateY, plateW, plateH);
  gc.strokeStyle = '#2a2e34';
  gc.lineWidth = 0.5;
  gc.strokeRect(plateX, plateY, plateW, plateH);
  gc.save();
  gc.font = `${Math.max(5, plateH * 0.7)}px monospace`;
  gc.fillStyle = 'rgba(200,205,210,0.75)';
  gc.textBaseline = 'middle';
  gc.textAlign = 'left';
  gc.fillText('D-DB 93 80 8812 001-8', plateX + 2, plateY + plateH/2);
  gc.restore();

  // --- Red stripe glossy specular highlight ---
  const stripeY2 = y + bodyH * 0.60;
  gc.save();
  const specGrad = gc.createLinearGradient(x, stripeY2, x + w, stripeY2);
  specGrad.addColorStop(0,    'rgba(255,160,120,0)');
  specGrad.addColorStop(0.25, 'rgba(255,200,160,0.22)');
  specGrad.addColorStop(0.55, 'rgba(255,255,220,0.30)');
  specGrad.addColorStop(0.75, 'rgba(255,190,140,0.18)');
  specGrad.addColorStop(1,    'rgba(255,160,120,0)');
  gc.fillStyle = specGrad;
  gc.fillRect(x, stripeY2, w, 4);
  gc.restore();

  // --- Coupling connector on right side ---
  const couplerY = y + bodyH * 0.75;
  gc.fillStyle = '#555';
  gc.fillRect(x + w - 2, couplerY, 6, 8);
  gc.fillStyle = '#333';
  gc.fillRect(x + w + 2, couplerY + 2, 4, 4);

  // --- Bogies (partially tucked under skirt) ---
  const bogieY = y + bodyH - 6;
  drawBogieSet(x + w * 0.22, bogieY, h);
  drawBogieSet(x + w * 0.72, bogieY, h);
}

function drawBogieSet(cx, cy, trainH) {
  const wheelR = Math.max(10, trainH * 0.038);
  const axleSpan = wheelR * 3.2;

  // Bogie frame (dark gray box partially hidden above)
  gc.fillStyle = '#2a2c30';
  gc.fillRect(cx - axleSpan * 0.7, cy - wheelR * 0.6, axleSpan * 1.4, wheelR * 0.8);

  // Two wheels per bogie set
  [-axleSpan * 0.38, axleSpan * 0.38].forEach(dx => {
    const wx = cx + dx;
    const wy = cy + wheelR * 0.4;

    // Shadow
    gc.fillStyle = 'rgba(0,0,0,0.35)';
    gc.beginPath();
    gc.arc(wx + 2, wy + 2, wheelR, 0, Math.PI * 2);
    gc.fill();

    // Wheel body — dark steel
    const rimGrad = gc.createRadialGradient(wx - wheelR * 0.3, wy - wheelR * 0.3, 1, wx, wy, wheelR);
    rimGrad.addColorStop(0,   '#707070');
    rimGrad.addColorStop(0.5, '#404040');
    rimGrad.addColorStop(1,   '#1a1a1a');
    gc.fillStyle = rimGrad;
    gc.beginPath();
    gc.arc(wx, wy, wheelR, 0, Math.PI * 2);
    gc.fill();

    // Wheel tread ring (lighter outer rim)
    gc.strokeStyle = '#585858';
    gc.lineWidth = wheelR * 0.12;
    gc.beginPath();
    gc.arc(wx, wy, wheelR * 0.88, 0, Math.PI * 2);
    gc.stroke();

    // Hub disc
    gc.fillStyle = '#555';
    gc.beginPath();
    gc.arc(wx, wy, wheelR * 0.32, 0, Math.PI * 2);
    gc.fill();
    gc.fillStyle = '#888';
    gc.beginPath();
    gc.arc(wx, wy, wheelR * 0.12, 0, Math.PI * 2);
    gc.fill();

    // Rail flange (bottom arc, touches rail)
    gc.fillStyle = '#3a3a3a';
    gc.beginPath();
    gc.arc(wx, wy, wheelR * 1.08, Math.PI * 0.25, Math.PI * 0.75);
    gc.fill();
  });
}

function drawLocomotive(x, y, w, h) {
  const bodyH = h * 0.52;
  const noseLen = w * 0.38; // how far the nose tip extends left of x

  // The locomotive occupies [x, x+w] in x (same as a wagon),
  // plus an aerodynamic nose that tapers to the left past x.

  // --- Drop shadow for full loco shape ---
  gc.save();
  gc.shadowColor = 'rgba(0,0,0,0.65)';
  gc.shadowBlur = 22;
  gc.shadowOffsetY = 10;
  gc.beginPath();
  // Nose tip -> top-left corner -> top-right -> bottom-right -> bottom-left -> back
  gc.moveTo(x - noseLen, y + bodyH * 0.50); // nose tip
  gc.lineTo(x, y + bodyH * 0.08);           // top of nose join
  gc.lineTo(x + w, y + bodyH * 0.08);       // top-right
  gc.lineTo(x + w, y + bodyH - 6);          // bottom-right
  gc.quadraticCurveTo(x + w, y + bodyH, x + w - 6, y + bodyH);
  gc.lineTo(x, y + bodyH);                  // bottom of nose join
  gc.closePath();
  gc.fillStyle = '#000';
  gc.fill();
  gc.restore();

  // --- Main body gradient (white/silver, same as wagon) ---
  gc.save();
  gc.beginPath();
  gc.moveTo(x - noseLen, y + bodyH * 0.50);
  gc.lineTo(x, y + bodyH * 0.08);
  gc.lineTo(x + w, y + bodyH * 0.08);
  gc.lineTo(x + w, y + bodyH - 6);
  gc.quadraticCurveTo(x + w, y + bodyH, x + w - 6, y + bodyH);
  gc.lineTo(x, y + bodyH);
  gc.closePath();
  const bodyGrad = gc.createLinearGradient(x - noseLen, y, x - noseLen, y + bodyH);
  bodyGrad.addColorStop(0,    '#c8ccd2'); // silver roof
  bodyGrad.addColorStop(0.10, '#e6eaee');
  bodyGrad.addColorStop(0.22, '#f4f6f8'); // bright
  bodyGrad.addColorStop(0.55, '#edf0f3');
  bodyGrad.addColorStop(0.82, '#dde0e4');
  bodyGrad.addColorStop(1,    '#c4c8cc');
  gc.fillStyle = bodyGrad;
  gc.fill();

  // Horizontal sheen overlay
  const sheenGrad = gc.createLinearGradient(x - noseLen, y, x + w, y);
  sheenGrad.addColorStop(0,    'rgba(255,255,255,0)');
  sheenGrad.addColorStop(0.35, 'rgba(255,255,255,0.13)');
  sheenGrad.addColorStop(0.55, 'rgba(255,255,255,0.20)');
  sheenGrad.addColorStop(0.75, 'rgba(255,255,255,0.08)');
  sheenGrad.addColorStop(1,    'rgba(255,255,255,0)');
  gc.fillStyle = sheenGrad;
  gc.fill();
  gc.restore();

  // --- Roof metallic strip ---
  gc.save();
  gc.beginPath();
  gc.moveTo(x - noseLen * 0.3, y + bodyH * 0.50);
  gc.lineTo(x, y + bodyH * 0.08);
  gc.lineTo(x + w, y + bodyH * 0.08);
  gc.lineTo(x + w, y + bodyH * 0.18);
  gc.lineTo(x, y + bodyH * 0.18);
  gc.lineTo(x - noseLen * 0.3, y + bodyH * 0.55);
  gc.closePath();
  const roofGrad = gc.createLinearGradient(x, y, x + w, y);
  roofGrad.addColorStop(0,   'rgba(170,180,194,0.75)');
  roofGrad.addColorStop(0.5, 'rgba(230,238,248,0.60)');
  roofGrad.addColorStop(1,   'rgba(185,194,208,0.70)');
  gc.fillStyle = roofGrad;
  gc.fill();
  gc.restore();

  // --- Red stripe: runs from right across body and tapers on nose ---
  const stripeY = y + bodyH * 0.60;
  const stripeH = 9;
  // Stripe on rectangular body portion
  gc.fillStyle = '#e8000f';
  gc.fillRect(x, stripeY, w, stripeH);
  // Stripe continues on nose (angled, tapering to tip)
  gc.beginPath();
  gc.moveTo(x, stripeY);
  gc.lineTo(x - noseLen, y + bodyH * 0.50); // nose tip (stripe collapses here)
  gc.lineTo(x - noseLen, y + bodyH * 0.50 + 1);
  gc.lineTo(x, stripeY + stripeH);
  gc.closePath();
  gc.fillStyle = '#e8000f';
  gc.fill();
  // Stripe edges
  gc.fillStyle = 'rgba(255,80,80,0.35)';
  gc.fillRect(x, stripeY, w, 2);
  gc.fillStyle = 'rgba(100,0,0,0.3)';
  gc.fillRect(x, stripeY + stripeH - 2, w, 2);

  // --- Gray underbody skirt ---
  const skirtY = y + bodyH * 0.88;
  gc.save();
  gc.beginPath();
  gc.moveTo(x, skirtY);
  gc.lineTo(x + w, skirtY);
  gc.lineTo(x + w, y + bodyH - 6);
  gc.quadraticCurveTo(x + w, y + bodyH, x + w - 6, y + bodyH);
  gc.lineTo(x, y + bodyH);
  gc.closePath();
  const skirtGrad = gc.createLinearGradient(x, skirtY, x, y + bodyH);
  skirtGrad.addColorStop(0, '#5a5e64');
  skirtGrad.addColorStop(1, '#3a3e44');
  gc.fillStyle = skirtGrad;
  gc.fill();
  gc.restore();

  // --- Ventilation grilles on loco skirt ---
  gc.save();
  gc.strokeStyle = 'rgba(0,0,0,0.45)';
  gc.lineWidth = 1;
  const locoGrillY = skirtY + (bodyH * 0.12) * 0.2;
  const locoGrillH = (bodyH * 0.12) * 0.6;
  const locoGrillSpacing = w * 0.12;
  for(let gx2 = x + w * 0.35; gx2 < x + w - locoGrillSpacing*0.3; gx2 += locoGrillSpacing) {
    const grillW2 = locoGrillSpacing * 0.55;
    gc.strokeRect(gx2, locoGrillY, grillW2, locoGrillH);
    for(let gl = 1; gl < 4; gl++) {
      gc.beginPath();
      gc.moveTo(gx2, locoGrillY + locoGrillH * gl/4);
      gc.lineTo(gx2 + grillW2, locoGrillY + locoGrillH * gl/4);
      gc.stroke();
    }
  }
  gc.restore();

  // --- Dirt streaks on loco body ---
  gc.save();
  gc.globalAlpha = 0.15;
  const locoStreakRand = seededRand(Math.round(x + 999));
  for(let si = 0; si < 5; si++) {
    const sx = x + w * 0.3 + locoStreakRand() * w * 0.65;
    const sy = y + bodyH * (0.72 + locoStreakRand() * 0.16);
    const sheight = bodyH * (0.07 + locoStreakRand() * 0.12);
    const sw2 = 2 + locoStreakRand() * 4;
    const sGrad = gc.createLinearGradient(sx, sy, sx, sy + sheight);
    sGrad.addColorStop(0, 'rgba(80,55,30,0)');
    sGrad.addColorStop(0.4, `rgba(70,48,22,${0.5 + locoStreakRand()*0.3})`);
    sGrad.addColorStop(1, 'rgba(50,35,15,0)');
    gc.fillStyle = sGrad;
    gc.fillRect(sx - sw2/2, sy, sw2, sheight);
  }
  gc.globalAlpha = 1;
  gc.restore();

  // --- Warm lamp tint on lower loco body ---
  gc.save();
  const locoLampTint = gc.createLinearGradient(x, y + bodyH * 0.60, x, y + bodyH);
  locoLampTint.addColorStop(0, 'rgba(255,160,40,0)');
  locoLampTint.addColorStop(1, 'rgba(255,140,30,0.06)');
  gc.fillStyle = locoLampTint;
  gc.fillRect(x, y + bodyH * 0.60, w, bodyH * 0.40);
  gc.restore();

  // --- Red stripe specular on loco ---
  gc.save();
  const locoSpecGrad = gc.createLinearGradient(x, y + bodyH * 0.60, x + w, y + bodyH * 0.60);
  locoSpecGrad.addColorStop(0,    'rgba(255,255,220,0)');
  locoSpecGrad.addColorStop(0.40, 'rgba(255,255,220,0.28)');
  locoSpecGrad.addColorStop(0.60, 'rgba(255,255,220,0.20)');
  locoSpecGrad.addColorStop(1,    'rgba(255,255,220,0)');
  gc.fillStyle = locoSpecGrad;
  gc.fillRect(x, y + bodyH * 0.60, w, 4);
  gc.restore();

  // --- Nose dark lower section (underbody of nose) ---
  gc.save();
  gc.beginPath();
  gc.moveTo(x, skirtY);
  gc.lineTo(x - noseLen, y + bodyH * 0.50);
  gc.lineTo(x, y + bodyH);
  gc.closePath();
  gc.fillStyle = '#42464c';
  gc.fill();
  gc.restore();

  // --- Windshield (angled on nose) ---
  const wsTop = y + bodyH * 0.10;
  const wsBottom = y + bodyH * 0.48;
  gc.save();
  gc.beginPath();
  gc.moveTo(x, wsTop);                             // top-left where nose joins
  gc.lineTo(x + w * 0.28, wsTop);                  // top-right of windshield
  gc.lineTo(x + w * 0.18, wsBottom);               // bottom-right
  gc.lineTo(x - noseLen * 0.55, wsBottom);         // bottom-left (on nose)
  gc.closePath();
  const wsGrad = gc.createLinearGradient(x - noseLen * 0.5, wsTop, x + w * 0.2, wsBottom);
  wsGrad.addColorStop(0,   '#0a1828');
  wsGrad.addColorStop(0.4, '#12263e');
  wsGrad.addColorStop(1,   '#080f1c');
  gc.fillStyle = wsGrad;
  gc.fill();
  // Windshield reflection
  gc.fillStyle = 'rgba(255,255,255,0.10)';
  gc.beginPath();
  gc.moveTo(x - noseLen * 0.45, wsTop + bodyH * 0.05);
  gc.lineTo(x + w * 0.20, wsTop + bodyH * 0.05);
  gc.lineTo(x + w * 0.14, wsTop + bodyH * 0.18);
  gc.lineTo(x - noseLen * 0.38, wsTop + bodyH * 0.18);
  gc.closePath();
  gc.fill();
  // Windshield frame
  gc.strokeStyle = '#2a2e36';
  gc.lineWidth = 2.5;
  gc.beginPath();
  gc.moveTo(x, wsTop);
  gc.lineTo(x + w * 0.28, wsTop);
  gc.lineTo(x + w * 0.18, wsBottom);
  gc.lineTo(x - noseLen * 0.55, wsBottom);
  gc.closePath();
  gc.stroke();
  gc.restore();

  // --- Headlights on nose ---
  const hlY1 = y + bodyH * 0.36;
  const hlY2 = y + bodyH * 0.54;
  [hlY1, hlY2].forEach((hlY, idx) => {
    const hlX = x - noseLen * 0.72 + idx * 8;
    // Housing
    gc.fillStyle = '#444';
    gc.beginPath();
    gc.arc(hlX, hlY, 7, 0, Math.PI * 2);
    gc.fill();
    // Glow
    gc.save();
    gc.shadowColor = 'rgba(255,240,140,0.9)';
    gc.shadowBlur = 18;
    const hlGrad = gc.createRadialGradient(hlX, hlY, 0, hlX, hlY, 6);
    hlGrad.addColorStop(0,   '#fff8e0');
    hlGrad.addColorStop(0.5, '#ffe080');
    hlGrad.addColorStop(1,   '#ffcc20');
    gc.fillStyle = hlGrad;
    gc.beginPath();
    gc.arc(hlX, hlY, 5.5, 0, Math.PI * 2);
    gc.fill();
    gc.restore();
  });

  // --- Windows on locomotive body (fewer, smaller) ---
  const locoWinCount = Math.max(1, Math.floor(w * 0.6 / 72));
  const locoWinW = 46;
  const locoWinH = bodyH * 0.22;
  const locoWinY = y + bodyH * 0.22;
  const locoWinStartX = x + w * 0.32;
  const locoWinSpacing = (w * 0.65 - locoWinW * locoWinCount) / (locoWinCount + 1);
  for(let wi = 0; wi < locoWinCount; wi++) {
    const wX = locoWinStartX + locoWinSpacing + wi * (locoWinW + locoWinSpacing);
    gc.fillStyle = '#2a2e36';
    gc.fillRect(wX - 3, locoWinY - 3, locoWinW + 6, locoWinH + 6);
    const glassGrad = gc.createLinearGradient(wX, locoWinY, wX, locoWinY + locoWinH);
    glassGrad.addColorStop(0,   '#0d1e35');
    glassGrad.addColorStop(0.5, '#142840');
    glassGrad.addColorStop(1,   '#080f1c');
    gc.fillStyle = glassGrad;
    gc.fillRect(wX, locoWinY, locoWinW, locoWinH);
    gc.fillStyle = 'rgba(255,255,255,0.12)';
    gc.fillRect(wX + 3, locoWinY + 2, locoWinW * 0.25, locoWinH * 0.55);
  }

  // --- "ICE" text on locomotive ---
  const iceX = x + w * 0.52;
  const iceY = y + bodyH * 0.73;
  gc.save();
  gc.font = `bold ${Math.round(bodyH * 0.16)}px Arial Black, sans-serif`;
  gc.textAlign = 'center';
  gc.textBaseline = 'middle';
  // Shadow
  gc.fillStyle = 'rgba(0,0,0,0.25)';
  gc.fillText('ICE', iceX + 2, iceY + 2);
  // Red text
  gc.fillStyle = '#e8000f';
  gc.fillText('ICE', iceX, iceY);
  gc.restore();

  // --- Bogies ---
  const bogieY = y + bodyH - 6;
  drawBogieSet(x + w * 0.25, bogieY, h);
  drawBogieSet(x + w * 0.75, bogieY, h);
}

function drawCharacter() {
  const charX = W * 0.12;
  const charY = H * 0.84;
  const scale = H / 380;

  gc.save();
  // Ground shadow under can position
  const shadowGrad = gc.createRadialGradient(charX, charY, 0, charX, charY, 18*scale);
  shadowGrad.addColorStop(0, 'rgba(0,0,0,0.5)');
  shadowGrad.addColorStop(1, 'rgba(0,0,0,0)');
  gc.fillStyle = shadowGrad;
  gc.beginPath();
  gc.ellipse(charX, charY, 18*scale, 5*scale, 0, 0, Math.PI*2);
  gc.fill();
  gc.restore();
}

function drawCan(cx, cy) {
  const scale = H / 380;
  const canX = cx;
  const canY = cy;

  uc.save();

  // Can body
  const canGrad = uc.createLinearGradient(canX-6*scale, canY, canX+6*scale, canY);
  canGrad.addColorStop(0,    '#990000');
  canGrad.addColorStop(0.3,  '#dd2200');
  canGrad.addColorStop(0.55, '#ff4400');
  canGrad.addColorStop(0.75, '#cc2200');
  canGrad.addColorStop(1,    '#880000');
  uc.fillStyle = canGrad;
  uc.beginPath();
  uc.roundRect(canX - 6*scale, canY - 24*scale, 12*scale, 28*scale, 4*scale);
  uc.fill();

  // Label band
  uc.fillStyle = 'rgba(255,255,255,0.12)';
  uc.fillRect(canX - 6*scale, canY - 14*scale, 12*scale, 6*scale);

  // Cap
  const capGrad = uc.createLinearGradient(canX-5*scale, canY-28*scale, canX+5*scale, canY-28*scale);
  capGrad.addColorStop(0, '#ccc');
  capGrad.addColorStop(0.5, '#fff');
  capGrad.addColorStop(1, '#aaa');
  uc.fillStyle = capGrad;
  uc.beginPath();
  uc.roundRect(canX - 5*scale, canY - 30*scale, 10*scale, 7*scale, 3*scale);
  uc.fill();

  // Nozzle
  uc.fillStyle = '#ccc';
  uc.fillRect(canX + 5*scale, canY - 28*scale, 7*scale, 3*scale);
  uc.fillStyle = '#fff';
  uc.beginPath();
  uc.arc(canX + 12*scale, canY - 27*scale, 2*scale, 0, Math.PI*2);
  uc.fill();

  // Spray burst (only when drawing and spray tool)
  if(isDrawing && tool === 'spray') {
    for(let si = 0; si < 3; si++) {
      const bx = canX + (14 + si*6)*scale;
      const by = canY - 27*scale;
      const br = (10 + si*5)*scale;
      const sg = uc.createRadialGradient(bx, by, 0, bx, by, br);
      sg.addColorStop(0, `rgba(255,80,20,${0.35 - si*0.08})`);
      sg.addColorStop(0.5, `rgba(255,120,40,${0.15 - si*0.04})`);
      sg.addColorStop(1, 'rgba(255,160,60,0)');
      uc.fillStyle = sg;
      uc.beginPath();
      uc.ellipse(bx, by, br, br*0.7, -0.1, 0, Math.PI*2);
      uc.fill();
    }
  }

  // LOOP label
  uc.save();
  uc.translate(canX, canY - 10*scale);
  uc.rotate(-Math.PI / 2);
  uc.font = `bold ${Math.round(5.5*scale)}px Arial Black, sans-serif`;
  uc.textAlign = 'center';
  uc.textBaseline = 'middle';
  uc.fillStyle = '#fff';
  uc.shadowColor = 'rgba(0,0,0,0.6)';
  uc.shadowBlur = 2*scale;
  uc.fillText('LOOP', 0, 0);
  uc.restore();

  uc.restore();
}

function drawUI() {
  uc.clearRect(0, 0, W, H);

  // Bottom hint bar
  const barH = 36;
  uc.fillStyle = 'rgba(0,0,0,0.7)';
  uc.fillRect(0, H - barH, W, barH);

  uc.fillStyle = 'rgba(233,69,96,0.9)';
  uc.font = 'bold 13px Courier New';
  uc.textAlign = 'left';
  uc.fillText('Ä = Farbe    Q = Spray    B = Block    E = Radierer    M = Löschen', 14, H - barH/2 + 5);

  // Color indicator
  const indX = W - 80;
  const indY = H - barH/2;
  uc.strokeStyle = '#fff';
  uc.lineWidth = 2;
  uc.beginPath();
  uc.arc(indX, indY, 12, 0, Math.PI*2);
  uc.stroke();
  uc.fillStyle = tool === 'eraser' ? '#333' : selectedColor;
  uc.beginPath();
  uc.arc(indX, indY, 10, 0, Math.PI*2);
  uc.fill();

  uc.fillStyle = 'rgba(255,255,255,0.5)';
  uc.font = '10px Courier New';
  uc.textAlign = 'right';
  uc.fillText(tool === 'eraser' ? 'RADIERER' : 'SPRAY', W - 20, H - barH/2 + 4);

  // Brush size indicator (small circle near bottom right)
  uc.strokeStyle = 'rgba(255,255,255,0.2)';
  uc.lineWidth = 1;
  uc.beginPath();
  uc.arc(W - 130, H - barH/2, brushSize/2 * 0.5 + 3, 0, Math.PI*2);
  uc.stroke();

  // Block tool drag preview
  if(tool === 'block' && isDrawing && blockStart) {
    const hex = selectedColor;
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    const px = Math.min(blockStart.x, mouseX), py = Math.min(blockStart.y, mouseY);
    const pw = Math.abs(mouseX - blockStart.x), ph = Math.abs(mouseY - blockStart.y);
    uc.fillStyle = `rgba(${r},${g},${b},0.35)`;
    uc.fillRect(px, py, pw, ph);
    uc.strokeStyle = `rgba(${r},${g},${b},0.9)`;
    uc.lineWidth = 2;
    uc.setLineDash([6,4]);
    uc.strokeRect(px, py, pw, ph);
    uc.setLineDash([]);
  }

  // --- Timer display (top center) ---
  if(gamePhase === 'spray' || gamePhase === 'alarm') {
    const mins = Math.floor(timeLeft / 60);
    const secs = timeLeft % 60;
    const timeStr = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    let timerColor = '#ff4444';
    if(timeLeft > 10) timerColor = '#ff4444';
    if(timeLeft <= 10 && timeLeft > 5) timerColor = '#ff8800';
    if(timeLeft <= 5) {
      // Flashing red
      timerColor = (Math.floor(Date.now() / 250) % 2 === 0) ? '#ff0000' : '#880000';
    }
    uc.save();
    uc.font = 'bold 52px "Courier New", monospace';
    uc.textAlign = 'center';
    uc.textBaseline = 'top';
    uc.shadowColor = 'rgba(255,0,0,0.7)';
    uc.shadowBlur = 18;
    uc.fillStyle = timerColor;
    uc.fillText(timeStr, W / 2, 18);
    uc.restore();
  }

  // Update wheel spin every frame
  frameCounter++;
  wheelAngle += 0.18;

  // --- ALARM phase overlays ---
  if(gamePhase === 'alarm') {
    // Siren color overlay
    uc.save();
    uc.fillStyle = sirenToggle ? 'rgba(255,0,0,0.13)' : 'rgba(0,80,255,0.13)';
    uc.fillRect(0, 0, W, H);
    uc.restore();

    // "BULLEN KOMMEN!" flashing text
    const flashOn = (Math.floor(Date.now() / 350) % 2 === 0);
    if(flashOn) {
      uc.save();
      uc.font = `bold ${Math.round(W * 0.07)}px "Courier New", monospace`;
      uc.textAlign = 'center';
      uc.textBaseline = 'middle';
      uc.shadowColor = 'rgba(255,0,0,0.9)';
      uc.shadowBlur = 28;
      uc.fillStyle = '#ff1111';
      uc.fillText('BULLEN KOMMEN!', W / 2, H * 0.18);
      uc.restore();
    }

    // Animate police car driving in from right to parking spot
    if(policeCar.active) {
      if(policeCarX > policeCar.targetX) {
        policeCarX -= 4;
        if(policeCarX < policeCar.targetX) policeCarX = policeCar.targetX;
      }
      policeCar.x = policeCarX;
      drawPoliceCar(policeCarX, H * 0.84 - 55, false);
    }

    // Draw escape car (parked, waiting)
    drawEscapeCar(escapeCarX, escapeCar.y, false);

    // Time remaining warning
    const timeElapsed = (Date.now() - alarmStartTime) / 1000;
    const catchIn = Math.max(0, 15 - timeElapsed);
    uc.save();
    uc.font = `bold ${Math.round(W * 0.025)}px "Courier New", monospace`;
    uc.textAlign = 'center';
    uc.textBaseline = 'middle';
    uc.fillStyle = catchIn < 5 ? '#ff4400' : '#ff8800';
    uc.shadowColor = 'rgba(255,100,0,0.8)';
    uc.shadowBlur = 12;
    uc.fillText(`FLIEH IN: ${Math.ceil(catchIn)}s`, W / 2, H * 0.28);
    uc.restore();
  }

  // --- CHASING phase ---
  if(gamePhase === 'chasing') {
    const now = Date.now();
    const elapsed = (now - chaseStartTime) / 1000;

    // Siren overlay still flashing
    uc.save();
    uc.fillStyle = sirenToggle ? 'rgba(255,0,0,0.10)' : 'rgba(0,80,255,0.10)';
    uc.fillRect(0, 0, W, H);
    uc.restore();

    if(chasePhase === 1) {
      // Phase 1: 0-2s — engine revving, escape car starts moving
      if(elapsed < 2) {
        // Rev lines around escape car
        uc.save();
        const revAlpha = 0.4 + 0.4 * Math.sin(elapsed * 20);
        uc.strokeStyle = `rgba(255,200,0,${revAlpha})`;
        uc.lineWidth = 2;
        for(let ri = 0; ri < 6; ri++) {
          const rx = escapeCarX + 200 + 15 + ri * 18;
          const ry = escapeCar.y + 45;
          uc.beginPath();
          uc.moveTo(rx, ry - 8);
          uc.lineTo(rx + 12, ry);
          uc.lineTo(rx, ry + 8);
          uc.stroke();
        }
        uc.restore();
        escapeCarX += elapsed * 3; // slow start
      } else {
        chasePhase = 2;
      }
      drawEscapeCar(escapeCarX, escapeCar.y, false);
      drawPoliceCar(policeCarX, H * 0.84 - 55, false);
    }

    if(chasePhase === 2) {
      // Phase 2: both cars race right, escape car faster
      escapeCarX += 12;
      policeCarX += 7;
      chaseDistance = Math.round((escapeCarX - policeCarX - 200) / 3);
      if(chaseDistance < 0) chaseDistance = 0;

      // Add exhaust puffs from escape car
      if(frameCounter % 4 === 0) {
        exhaustPuffs.push({
          x: escapeCarX + 5,
          y: escapeCar.y + 75,
          r: 8,
          alpha: 0.5,
          vx: -2 - Math.random() * 2,
          vy: -1 - Math.random(),
        });
      }

      // Draw exhaust puffs
      for(let ep = exhaustPuffs.length - 1; ep >= 0; ep--) {
        const p = exhaustPuffs[ep];
        p.x += p.vx;
        p.y += p.vy;
        p.r += 0.8;
        p.alpha -= 0.025;
        if(p.alpha <= 0) { exhaustPuffs.splice(ep, 1); continue; }
        uc.save();
        uc.globalAlpha = p.alpha;
        uc.fillStyle = '#888';
        uc.beginPath();
        uc.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        uc.fill();
        uc.restore();
      }

      // Draw both cars with speed lines
      drawEscapeCar(escapeCarX, escapeCar.y, true);
      if(policeCarX > -250) drawPoliceCar(policeCarX, H * 0.84 - 55, true);

      // Distance indicator
      const distLabel = chaseDistance >= 200
        ? 'ENTKOMMEN! 🚨'
        : `Abstand: ${chaseDistance}m`;
      uc.save();
      uc.font = `bold ${Math.round(W * 0.032)}px "Courier New", monospace`;
      uc.textAlign = 'center';
      uc.textBaseline = 'middle';
      uc.fillStyle = chaseDistance >= 150 ? '#00ff88' : '#ffcc00';
      uc.shadowColor = chaseDistance >= 150 ? 'rgba(0,255,100,0.8)' : 'rgba(255,200,0,0.8)';
      uc.shadowBlur = 16;
      uc.fillText(distLabel, W / 2, H * 0.22);
      uc.restore();

      // Win condition
      if(chaseDistance >= 200) {
        gamePhase = 'escaped';
        clearInterval(sirenInterval);
        let flash = true;
        resultFlashInterval = setInterval(() => { resultFlash = flash; flash = !flash; }, 400);
        setTimeout(() => { clearInterval(resultFlashInterval); resultFlash = true; }, 5000);
      }
    }
  }

  // --- ESCAPED phase ---
  if(gamePhase === 'escaped') {
    // Keep cars moving
    escapeCarX += 12;
    policeCarX += 4;

    // Draw remaining exhaust
    for(let ep = exhaustPuffs.length - 1; ep >= 0; ep--) {
      const p = exhaustPuffs[ep];
      p.x += p.vx; p.y += p.vy; p.r += 0.8; p.alpha -= 0.03;
      if(p.alpha <= 0) { exhaustPuffs.splice(ep, 1); continue; }
      uc.save(); uc.globalAlpha = p.alpha; uc.fillStyle = '#888';
      uc.beginPath(); uc.arc(p.x, p.y, p.r, 0, Math.PI * 2); uc.fill(); uc.restore();
    }

    if(escapeCarX < W + 250) drawEscapeCar(escapeCarX, escapeCar.y, true);
    if(policeCarX < W + 250 && policeCarX > -250) drawPoliceCar(policeCarX, H * 0.84 - 55, true);

    // "ENTKOMMEN!" flash
    const flashOn2 = (Math.floor(Date.now() / 400) % 2 === 0);
    if(flashOn2 || resultFlash) {
      uc.save();
      uc.font = `bold ${Math.round(W * 0.07)}px "Courier New", monospace`;
      uc.textAlign = 'center';
      uc.textBaseline = 'middle';
      uc.shadowColor = 'rgba(0,255,100,0.9)';
      uc.shadowBlur = 30;
      uc.fillStyle = '#00ff66';
      uc.fillText('ENTKOMMEN! 🚨', W / 2, H * 0.28);
      uc.restore();
    }

    // Result screen
    uc.save();
    uc.fillStyle = 'rgba(0,0,0,0.78)';
    uc.beginPath();
    uc.roundRect(W * 0.18, H * 0.38, W * 0.64, H * 0.26, 12);
    uc.fill();
    uc.strokeStyle = '#00ff66';
    uc.lineWidth = 2;
    uc.stroke();
    uc.font = `bold ${Math.round(W * 0.030)}px "Courier New", monospace`;
    uc.textAlign = 'center';
    uc.textBaseline = 'middle';
    uc.fillStyle = '#00ff66';
    uc.fillText('Du hast entkommen!', W / 2, H * 0.47);
    uc.fillStyle = '#aaffcc';
    uc.font = `${Math.round(W * 0.018)}px "Courier New", monospace`;
    uc.fillText('Dein Graffiti bleibt für immer!', W / 2, H * 0.55);
    uc.restore();
  }

  // --- CAUGHT phase ---
  if(gamePhase === 'caught') {
    // Red overlay
    uc.save();
    uc.fillStyle = 'rgba(180,0,0,0.25)';
    uc.fillRect(0, 0, W, H);
    uc.restore();

    // "ERWISCHT!" text
    const flashOn3 = (Math.floor(Date.now() / 300) % 2 === 0);
    if(flashOn3) {
      uc.save();
      uc.font = `bold ${Math.round(W * 0.09)}px "Courier New", monospace`;
      uc.textAlign = 'center';
      uc.textBaseline = 'middle';
      uc.shadowColor = 'rgba(255,0,0,0.9)';
      uc.shadowBlur = 40;
      uc.fillStyle = '#ff1111';
      uc.fillText('ERWISCHT!', W / 2, H * 0.25);
      uc.restore();
    }

    // Game Over box with restart button
    uc.save();
    uc.fillStyle = 'rgba(0,0,0,0.85)';
    uc.beginPath();
    uc.roundRect(W * 0.2, H * 0.38, W * 0.60, H * 0.30, 14);
    uc.fill();
    uc.strokeStyle = '#ff2200';
    uc.lineWidth = 2;
    uc.stroke();
    uc.font = `bold ${Math.round(W * 0.035)}px "Courier New", monospace`;
    uc.textAlign = 'center';
    uc.textBaseline = 'middle';
    uc.fillStyle = '#ff4422';
    uc.fillText('GAME OVER', W / 2, H * 0.46);
    uc.fillStyle = '#ffaaaa';
    uc.font = `${Math.round(W * 0.018)}px "Courier New", monospace`;
    uc.fillText('Die Polizei hat dich erwischt!', W / 2, H * 0.53);
    // Restart button
    const btnX = W * 0.36, btnY = H * 0.59, btnW = W * 0.28, btnH = H * 0.07;
    uc.fillStyle = 'rgba(233,69,96,0.85)';
    uc.beginPath();
    uc.roundRect(btnX, btnY, btnW, btnH, 8);
    uc.fill();
    uc.strokeStyle = '#ff4466';
    uc.lineWidth = 2;
    uc.stroke();
    uc.font = `bold ${Math.round(W * 0.022)}px "Courier New", monospace`;
    uc.fillStyle = '#fff';
    uc.fillText('[ NEU STARTEN ]', W / 2, btnY + btnH / 2);
    uc.restore();
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function isOnTrain(x, y) {
  return x >= trainRegion.x && x <= trainRegion.x + trainRegion.w &&
         y >= trainRegion.y && y <= trainRegion.y + trainRegion.h;
}

function sprayPaint(x, y) {
  if(!isOnTrain(x, y)) return;

  if(tool === 'eraser') {
    pc.save();
    pc.globalCompositeOperation = 'destination-out';
    const eraserGrad = pc.createRadialGradient(x, y, 0, x, y, brushSize);
    eraserGrad.addColorStop(0, 'rgba(0,0,0,1)');
    eraserGrad.addColorStop(0.5, 'rgba(0,0,0,0.8)');
    eraserGrad.addColorStop(1, 'rgba(0,0,0,0)');
    pc.fillStyle = eraserGrad;
    pc.beginPath();
    pc.arc(x, y, brushSize, 0, Math.PI*2);
    pc.fill();
    pc.restore();
    return;
  }

  // Parse color
  const hex = selectedColor;
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);

  // Subtle mist cloud around spray point
  pc.save();
  const mistGrad = pc.createRadialGradient(x, y, 0, x, y, brushSize * 1.8);
  mistGrad.addColorStop(0, `rgba(${r},${g},${b},${paintOpacity * 0.08})`);
  mistGrad.addColorStop(0.5, `rgba(${r},${g},${b},${paintOpacity * 0.03})`);
  mistGrad.addColorStop(1, `rgba(${r},${g},${b},0)`);
  pc.fillStyle = mistGrad;
  pc.beginPath();
  pc.arc(x, y, brushSize * 1.8, 0, Math.PI*2);
  pc.fill();
  pc.restore();

  // Main spray blob
  pc.save();
  const grad = pc.createRadialGradient(x, y, 0, x, y, brushSize);
  grad.addColorStop(0, `rgba(${r},${g},${b},${paintOpacity})`);
  grad.addColorStop(0.4, `rgba(${r},${g},${b},${paintOpacity*0.6})`);
  grad.addColorStop(0.75, `rgba(${r},${g},${b},${paintOpacity*0.2})`);
  grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
  pc.fillStyle = grad;
  pc.beginPath();
  pc.arc(x, y, brushSize, 0, Math.PI*2);
  pc.fill();

  // Scatter dots (spray effect) — wider size range
  const dotCount = Math.floor(brushSize * 0.9);
  for(let i = 0; i < dotCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * brushSize * 1.3;
    const dx = x + Math.cos(angle) * dist;
    const dy = y + Math.sin(angle) * dist;
    if(!isOnTrain(dx, dy)) continue;
    const alpha = Math.random() * paintOpacity * 0.55;
    const dsize = Math.random() * Math.random() * 4.5 + 0.4; // biased toward smaller
    pc.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    pc.beginPath();
    pc.arc(dx, dy, dsize, 0, Math.PI*2);
    pc.fill();
  }
  pc.restore();

  // Occasional paint drip below spray point
  if(Math.random() < 0.04 * (brushSize / 18)) {
    const dripX = x + (Math.random() - 0.5) * brushSize * 0.6;
    const dripStartY = y + brushSize * 0.4;
    const dripLen = brushSize * (0.8 + Math.random() * 1.6);
    if(isOnTrain(dripX, dripStartY + dripLen)) {
      pc.save();
      const dripGrad = pc.createLinearGradient(dripX, dripStartY, dripX, dripStartY + dripLen);
      dripGrad.addColorStop(0, `rgba(${r},${g},${b},${paintOpacity * 0.7})`);
      dripGrad.addColorStop(0.7, `rgba(${r},${g},${b},${paintOpacity * 0.4})`);
      dripGrad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      pc.fillStyle = dripGrad;
      const dripW = 1.2 + Math.random() * 1.8;
      pc.beginPath();
      pc.ellipse(dripX, dripStartY + dripLen * 0.5, dripW, dripLen * 0.5, 0, 0, Math.PI*2);
      pc.fill();
      // Drip bulge at bottom
      pc.fillStyle = `rgba(${r},${g},${b},${paintOpacity * 0.55})`;
      pc.beginPath();
      pc.arc(dripX, dripStartY + dripLen, dripW * 1.5, 0, Math.PI*2);
      pc.fill();
      pc.restore();
    }
  }
}

// Input
paintCanvas.style.pointerEvents = 'auto';

// Continuous can animation loop — always runs
function canLoop() {
  sprayX += (targetX - sprayX) * LERP;
  sprayY += (targetY - sprayY) * LERP;
  if(isDrawing && tool === 'spray') sprayPaint(sprayX, sprayY);
  drawUI();
  requestAnimationFrame(canLoop);
}

paintCanvas.addEventListener('mousedown', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  if(menuOpen) return;
  // Restart button (caught phase)
  if(gamePhase === 'caught') {
    const btnX = W * 0.36, btnY = H * 0.59, btnW = W * 0.28, btnH = H * 0.07;
    if(e.clientX >= btnX && e.clientX <= btnX + btnW && e.clientY >= btnY && e.clientY <= btnY + btnH) {
      restartGame();
      return;
    }
  }
  // Check escape car click first
  if(checkEscapeClick(e.clientX, e.clientY)) return;
  isDrawing = true;
  targetX = e.clientX; targetY = e.clientY;
  if(tool === 'block') blockStart = { x: e.clientX, y: e.clientY };
});
paintCanvas.addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  if(menuOpen) return;
  targetX = e.clientX; targetY = e.clientY;
  if(tool === 'eraser') sprayPaint(e.clientX, e.clientY);
});
paintCanvas.addEventListener('mouseup', e => {
  if(tool === 'block' && blockStart && isDrawing) {
    placeBlock(blockStart.x, blockStart.y, e.clientX, e.clientY);
    blockStart = null;
  }
  isDrawing = false;
});
paintCanvas.addEventListener('mouseleave', () => { isDrawing = false; });

// Touch support
paintCanvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if(menuOpen) return;
  isDrawing = true;
  const t = e.touches[0];
  sprayPaint(t.clientX, t.clientY);
}, {passive:false});
paintCanvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if(!isDrawing || menuOpen) return;
  const t = e.touches[0];
  sprayPaint(t.clientX, t.clientY);
}, {passive:false});
paintCanvas.addEventListener('touchend', () => { isDrawing = false; });

document.addEventListener('keydown', e => {
  if(e.key === 'Ä' || e.key === 'ä' || e.keyCode === 196 || e.keyCode === 228) {
    toggleMenu();
    e.preventDefault();
  }
  if(e.key === 'Escape' && menuOpen) {
    toggleMenu();
  }
  if(e.key === 'e' || e.key === 'E') {
    setTool('eraser');
    paintCanvas.style.cursor = 'crosshair';
    drawUI();
  }
  if(e.key === 'q' || e.key === 'Q') {
    setTool('spray');
    drawUI();
  }
  if(e.key === 'b' || e.key === 'B') {
    setTool('block');
    drawUI();
  }
  if(e.key === 'm' || e.key === 'M') {
    clearAllPaint();
  }
});

// Initial render
function render() {
  gc.clearRect(0, 0, W, H);
  drawBackground();
  drawTrain();
  drawCharacter();
  drawUI();
}

// Resize handler
window.addEventListener('resize', () => {
  W = window.innerWidth;
  H = window.innerHeight;
  gameCanvas.width = uiCanvas.width = W;
  gameCanvas.height = uiCanvas.height = H;
  // Keep paint canvas but resize (this clears it — a tradeoff)
  // To preserve: copy to temp, resize, restore
  const tmp = document.createElement('canvas');
  tmp.width = paintCanvas.width;
  tmp.height = paintCanvas.height;
  tmp.getContext('2d').drawImage(paintCanvas, 0, 0);
  paintCanvas.width = W;
  paintCanvas.height = H;
  pc.drawImage(tmp, 0, 0);
  render();
});

render();
sprayX = W / 2; sprayY = H / 2;
targetX = W / 2; targetY = H / 2;
mouseX = W / 2; mouseY = H / 2;
escapeCar.y = H * 0.84 - 55;
escapeCarX = W * 0.05;
policeCarX = W + 250;
canLoop();
startTimer();
</script>
