<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graffiti Train Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    user-select: none;
  }
  #gameCanvas {
    display: block;
    cursor: crosshair;
  }
  #paintCanvas {
    position: absolute;
    top: 0; left: 0;
    cursor: crosshair;
    pointer-events: none;
  }
  #uiCanvas {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
  }
  #colorMenu {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    border: 2px solid #e94560;
    border-radius: 12px;
    padding: 20px;
    z-index: 100;
    box-shadow: 0 0 40px rgba(233,69,96,0.4), inset 0 0 20px rgba(0,0,0,0.5);
    min-width: 340px;
  }
  #colorMenu h2 {
    color: #e94560;
    text-align: center;
    font-size: 18px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 15px;
    text-shadow: 0 0 10px rgba(233,69,96,0.8);
  }
  .color-grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 3px;
    margin-bottom: 15px;
  }
  .color-swatch {
    width: 18px;
    height: 18px;
    border-radius: 3px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.1s, border-color 0.1s;
  }
  .color-swatch:hover {
    transform: scale(1.2);
    border-color: #fff;
  }
  .color-swatch.selected {
    border-color: #fff;
    transform: scale(1.15);
    box-shadow: 0 0 8px rgba(255,255,255,0.6);
  }
  .menu-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    color: #aaa;
    font-size: 13px;
  }
  .menu-row label {
    min-width: 90px;
    color: #ccc;
  }
  input[type=range] {
    flex: 1;
    accent-color: #e94560;
    cursor: pointer;
  }
  #brushSizeVal {
    min-width: 25px;
    color: #e94560;
    font-weight: bold;
  }
  .tool-buttons {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .tool-btn {
    flex: 1;
    padding: 8px;
    border: 2px solid #333;
    border-radius: 6px;
    background: #111;
    color: #aaa;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    transition: all 0.15s;
  }
  .tool-btn:hover { border-color: #e94560; color: #fff; }
  .tool-btn.active {
    border-color: #e94560;
    background: rgba(233,69,96,0.2);
    color: #e94560;
  }
  #closeMenuBtn {
    width: 100%;
    padding: 8px;
    background: rgba(233,69,96,0.15);
    border: 1px solid #e94560;
    border-radius: 6px;
    color: #e94560;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    transition: background 0.15s;
  }
  #closeMenuBtn:hover { background: rgba(233,69,96,0.3); }
  #currentColorPreview {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 0 10px rgba(255,255,255,0.3);
    flex-shrink: 0;
  }
  .opacity-section {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    color: #ccc;
    font-size: 13px;
  }
  .opacity-section label { min-width: 90px; }
  #opacityVal { min-width: 30px; color: #e94560; font-weight: bold; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<canvas id="paintCanvas"></canvas>
<canvas id="uiCanvas"></canvas>

<div id="colorMenu">
  <h2>// Farbmenü //</h2>
  <div class="menu-row" style="justify-content:center; margin-bottom:14px;">
    <div id="currentColorPreview"></div>
    <span style="color:#ccc; font-size:12px; margin-left:10px;">Aktuelle Farbe</span>
  </div>
  <div class="color-grid" id="colorGrid"></div>
  <div class="tool-buttons">
    <button class="tool-btn active" id="btnSpray" onclick="setTool('spray')">Spray</button>
    <button class="tool-btn" id="btnEraser" onclick="setTool('eraser')">Radierer</button>
  </div>
  <div class="menu-row">
    <label>Pinselgröße:</label>
    <input type="range" id="brushSize" min="5" max="60" value="18">
    <span id="brushSizeVal">18</span>
  </div>
  <div class="opacity-section">
    <label>Deckkraft:</label>
    <input type="range" id="opacitySlider" min="10" max="100" value="70">
    <span id="opacityVal">70</span>%
  </div>
  <button id="closeMenuBtn" onclick="toggleMenu()">[ SCHLIESSEN ]</button>
</div>

<script>
const gameCanvas = document.getElementById('gameCanvas');
const paintCanvas = document.getElementById('paintCanvas');
const uiCanvas = document.getElementById('uiCanvas');
const gc = gameCanvas.getContext('2d');
const pc = paintCanvas.getContext('2d');
const uc = uiCanvas.getContext('2d');

let W = window.innerWidth;
let H = window.innerHeight;

gameCanvas.width = paintCanvas.width = uiCanvas.width = W;
gameCanvas.height = paintCanvas.height = uiCanvas.height = H;

// State
let tool = 'spray';
let brushSize = 18;
let paintOpacity = 0.70;
let isDrawing = false;
let menuOpen = false;
let selectedColor = '#ff2200';
let trainRegion = { x: 0, y: 0, w: 0, h: 0 };

// Color palette
const colors = [
  '#ff0000','#ff3300','#ff6600','#ff9900','#ffcc00','#ffff00',
  '#ccff00','#99ff00','#66ff00','#33ff00',
  '#00ff00','#00ff33','#00ff66','#00ff99','#00ffcc','#00ffff',
  '#00ccff','#0099ff','#0066ff','#0033ff',
  '#0000ff','#3300ff','#6600ff','#9900ff','#cc00ff','#ff00ff',
  '#ff00cc','#ff0099','#ff0066','#ff0033',
  '#ffffff','#dddddd','#aaaaaa','#888888','#555555','#222222',
  '#ff8080','#80ff80','#8080ff','#ffff80',
  '#ff80ff','#80ffff','#ffa040','#40a0ff','#ff4080','#80ff40',
  '#c0a000','#a000c0','#00a0c0','#c00040',
  '#ffe0c0','#c0e0ff','#ffc0e0','#e0ffc0',
  '#400000','#004000','#000040','#404000',
  '#ff6666','#66ff66','#6666ff','#ffaa66',
  '#aa66ff','#66ffaa','#ffdd44','#44ddff',
  '#ff44dd','#44ffdd','#ff8844','#44ff88',
  '#8844ff','#88ff44','#ff4488','#4488ff',
  '#ff2266','#66ff22','#2266ff','#ff6622',
  '#6622ff','#22ff66','#ffcc44','#44ccff',
  '#ff44cc','#44ffcc','#cc44ff','#ccff44',
  '#ff0044','#44ff00','#0044ff','#ff4400',
  '#4400ff','#00ff44','#aaff00','#00aaff',
  '#ff00aa','#ffaa00','#00ffaa','#aa00ff',
  '#ff5500','#00ff55','#5500ff','#ff0055',
  '#55ff00','#0055ff','#ffbb00','#00bbff',
  '#ff00bb','#bbff00','#00ffbb','#bb00ff',
];

// Build color grid
const grid = document.getElementById('colorGrid');
colors.forEach((c, i) => {
  const sw = document.createElement('div');
  sw.className = 'color-swatch' + (c === selectedColor ? ' selected' : '');
  sw.style.background = c;
  sw.title = c;
  sw.addEventListener('click', () => {
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
    sw.classList.add('selected');
    selectedColor = c;
    document.getElementById('currentColorPreview').style.background = c;
    setTool('spray');
  });
  grid.appendChild(sw);
});
document.getElementById('currentColorPreview').style.background = selectedColor;

// Brush size
document.getElementById('brushSize').addEventListener('input', function() {
  brushSize = +this.value;
  document.getElementById('brushSizeVal').textContent = brushSize;
});

// Opacity
document.getElementById('opacitySlider').addEventListener('input', function() {
  paintOpacity = +this.value / 100;
  document.getElementById('opacityVal').textContent = this.value;
});

function setTool(t) {
  tool = t;
  document.getElementById('btnSpray').classList.toggle('active', t === 'spray');
  document.getElementById('btnEraser').classList.toggle('active', t === 'eraser');
}

function toggleMenu() {
  menuOpen = !menuOpen;
  document.getElementById('colorMenu').style.display = menuOpen ? 'block' : 'none';
  drawUI();
}

// ---- Drawing the scene ----

function drawBackground() {
  // Sky gradient — deep urban night
  const skyGrad = gc.createLinearGradient(0, 0, 0, H * 0.68);
  skyGrad.addColorStop(0, '#020208');
  skyGrad.addColorStop(0.4, '#08081e');
  skyGrad.addColorStop(0.8, '#121228');
  skyGrad.addColorStop(1, '#1c1830');
  gc.fillStyle = skyGrad;
  gc.fillRect(0, 0, W, H * 0.68);

  // Stars with varying brightness
  const starData = [
    [0.05,0.04,1.8],[0.12,0.09,1.2],[0.22,0.03,2.0],[0.35,0.07,1.0],[0.48,0.02,1.5],[0.58,0.08,1.1],
    [0.70,0.04,1.8],[0.81,0.10,1.3],[0.90,0.03,1.0],[0.95,0.07,1.6],[0.15,0.15,1.2],[0.28,0.18,0.9],
    [0.42,0.12,1.4],[0.55,0.19,1.0],[0.67,0.13,1.7],[0.78,0.17,1.1],[0.88,0.11,0.8],[0.03,0.22,1.3],
    [0.18,0.25,1.0],[0.32,0.28,1.5],[0.46,0.23,1.2],[0.60,0.27,0.9],[0.74,0.21,1.6],[0.85,0.26,1.0],
    [0.97,0.14,1.4],[0.09,0.30,1.1],[0.25,0.33,0.8],[0.38,0.31,1.3],[0.52,0.35,1.0],[0.64,0.29,1.5],
  ];
  starData.forEach(([sx,sy,sr]) => {
    gc.save();
    gc.fillStyle = `rgba(255,255,255,${0.5 + sr*0.2})`;
    gc.shadowColor = '#aaaaff';
    gc.shadowBlur = sr > 1.5 ? 4 : 0;
    gc.beginPath();
    gc.arc(sx*W, sy*H*0.62, sr*0.7, 0, Math.PI*2);
    gc.fill();
    gc.restore();
  });

  // Moon with glow halo
  gc.save();
  const moonGlow = gc.createRadialGradient(W*0.88, H*0.09, 20, W*0.88, H*0.09, 80);
  moonGlow.addColorStop(0, 'rgba(255,230,120,0.15)');
  moonGlow.addColorStop(1, 'rgba(255,230,120,0)');
  gc.fillStyle = moonGlow;
  gc.fillRect(W*0.88-80, H*0.09-80, 160, 160);
  gc.fillStyle = '#ffe9a8';
  gc.shadowColor = '#ffe060';
  gc.shadowBlur = 25;
  gc.beginPath();
  gc.arc(W*0.88, H*0.09, 30, 0, Math.PI*2);
  gc.fill();
  gc.fillStyle = '#08081e';
  gc.shadowBlur = 0;
  gc.beginPath();
  gc.arc(W*0.88+13, H*0.09-7, 26, 0, Math.PI*2);
  gc.fill();
  gc.restore();

  // Buildings — layered depth (far/mid/near)
  const buildingLayers = [
    { color: '#0a0a1a', winColor: 'rgba(255,200,80,0.12)', list: [
      {x:0.00,y:0.22,w:0.07,h:0.46},{x:0.06,y:0.14,w:0.05,h:0.54},
      {x:0.64,y:0.16,w:0.06,h:0.52},{x:0.88,y:0.18,w:0.07,h:0.50},
    ]},
    { color: '#0f0f20', winColor: 'rgba(255,200,80,0.20)', list: [
      {x:0.04,y:0.26,w:0.05,h:0.42},{x:0.10,y:0.18,w:0.04,h:0.50},
      {x:0.13,y:0.28,w:0.06,h:0.40},{x:0.18,y:0.20,w:0.04,h:0.48},
      {x:0.70,y:0.22,w:0.05,h:0.46},{x:0.74,y:0.14,w:0.03,h:0.54},
      {x:0.77,y:0.26,w:0.06,h:0.42},{x:0.82,y:0.20,w:0.04,h:0.48},
      {x:0.93,y:0.24,w:0.05,h:0.44},{x:0.97,y:0.28,w:0.03,h:0.40},
    ]},
    { color: '#161626', winColor: 'rgba(255,210,100,0.30)', list: [
      {x:0.00,y:0.32,w:0.04,h:0.36},{x:0.21,y:0.24,w:0.04,h:0.44},
      {x:0.25,y:0.30,w:0.03,h:0.38},{x:0.65,y:0.30,w:0.04,h:0.38},
      {x:0.86,y:0.28,w:0.04,h:0.40},{x:0.96,y:0.32,w:0.04,h:0.36},
    ]},
  ];

  buildingLayers.forEach(layer => {
    layer.list.forEach(b => {
      // Building body with slight gradient
      const bGrad = gc.createLinearGradient(b.x*W, b.y*H, b.x*W + b.w*W, b.y*H);
      bGrad.addColorStop(0, layer.color);
      bGrad.addColorStop(1, shadeColor(layer.color, 10));
      gc.fillStyle = bGrad;
      gc.fillRect(b.x*W, b.y*H, b.w*W, b.h*H);

      // Windows with slight randomness
      for(let wy = b.y*H + 8; wy < (b.y+b.h)*H - 8; wy += 14) {
        for(let wx = b.x*W + 5; wx < (b.x+b.w)*W - 5; wx += 9) {
          if(Math.random() < 0.40) {
            gc.fillStyle = layer.winColor;
            gc.fillRect(wx, wy, 5, 7);
            // Occasional bright window
            if(Math.random() < 0.15) {
              gc.fillStyle = 'rgba(255,240,120,0.5)';
              gc.fillRect(wx+1, wy+1, 3, 5);
            }
          }
        }
      }

      // Rooftop details (antenna, water tower)
      if(Math.random() < 0.4) {
        gc.fillStyle = '#333';
        gc.fillRect(b.x*W + b.w*W*0.4, b.y*H - 12, 2, 12);
        gc.fillStyle = '#555';
        gc.beginPath();
        gc.arc(b.x*W + b.w*W*0.4 + 1, b.y*H - 14, 4, 0, Math.PI*2);
        gc.fill();
      }
    });
  });

  // Street lamp posts
  [0.05, 0.30, 0.55, 0.80, 0.95].forEach(lx => {
    const lampX = lx * W;
    const lampY = H * 0.68;
    gc.strokeStyle = '#444';
    gc.lineWidth = 3;
    gc.beginPath();
    gc.moveTo(lampX, lampY);
    gc.lineTo(lampX, lampY - H*0.16);
    gc.lineTo(lampX + 18, lampY - H*0.16);
    gc.stroke();
    // Lamp glow
    gc.save();
    const lampGlow = gc.createRadialGradient(lampX+18, lampY - H*0.16, 0, lampX+18, lampY - H*0.16, 40);
    lampGlow.addColorStop(0, 'rgba(255,200,80,0.5)');
    lampGlow.addColorStop(0.4, 'rgba(255,180,60,0.15)');
    lampGlow.addColorStop(1, 'rgba(255,160,40,0)');
    gc.fillStyle = lampGlow;
    gc.fillRect(lampX - 22, lampY - H*0.16 - 40, 80, 80);
    gc.fillStyle = '#ffe090';
    gc.shadowColor = '#ffcc44';
    gc.shadowBlur = 10;
    gc.beginPath();
    gc.arc(lampX + 18, lampY - H*0.16, 5, 0, Math.PI*2);
    gc.fill();
    gc.restore();
  });

  // Ground — asphalt texture
  const groundGrad = gc.createLinearGradient(0, H*0.68, 0, H);
  groundGrad.addColorStop(0, '#1e1a14');
  groundGrad.addColorStop(0.3, '#161410');
  groundGrad.addColorStop(1, '#080806');
  gc.fillStyle = groundGrad;
  gc.fillRect(0, H*0.68, W, H*0.32);

  // Asphalt cracks
  gc.strokeStyle = 'rgba(0,0,0,0.5)';
  gc.lineWidth = 1;
  [[0.1,0.75,0.18,0.80],[0.3,0.72,0.35,0.78],[0.6,0.74,0.67,0.82],[0.8,0.76,0.85,0.80]].forEach(([x1,y1,x2,y2]) => {
    gc.beginPath(); gc.moveTo(x1*W,y1*H); gc.lineTo(x2*W,y2*H); gc.stroke();
  });

  // Ballast / gravel between tracks
  gc.fillStyle = '#2a2420';
  gc.fillRect(0, H*0.82, W, H*0.06);
  // Gravel dots
  for(let i = 0; i < 200; i++) {
    gc.fillStyle = `rgba(${80+Math.random()*40},${70+Math.random()*30},${60+Math.random()*20},0.6)`;
    gc.fillRect(Math.random()*W, H*0.82 + Math.random()*H*0.06, Math.random()*4+1, Math.random()*3+1);
  }

  // Rail tracks — steel with highlight
  const trackY = H * 0.84;
  [0, 18].forEach(offset => {
    const railGrad = gc.createLinearGradient(0, trackY+offset, 0, trackY+offset+6);
    railGrad.addColorStop(0, '#aaa');
    railGrad.addColorStop(0.4, '#888');
    railGrad.addColorStop(1, '#444');
    gc.fillStyle = railGrad;
    gc.fillRect(0, trackY+offset, W, 6);
  });

  // Rail ties — wooden sleepers with grain
  for(let tx = 0; tx < W; tx += 28) {
    const tieGrad = gc.createLinearGradient(tx, trackY-4, tx+8, trackY-4);
    tieGrad.addColorStop(0, '#4a3820');
    tieGrad.addColorStop(0.5, '#5a4828');
    tieGrad.addColorStop(1, '#3a2818');
    gc.fillStyle = tieGrad;
    gc.fillRect(tx, trackY - 5, 8, 30);
    gc.strokeStyle = 'rgba(0,0,0,0.3)';
    gc.lineWidth = 0.5;
    gc.beginPath(); gc.moveTo(tx+2, trackY-4); gc.lineTo(tx+2, trackY+26); gc.stroke();
    gc.beginPath(); gc.moveTo(tx+5, trackY-4); gc.lineTo(tx+5, trackY+26); gc.stroke();
  }

  // Ground puddles / oil stains
  gc.save();
  [[0.15,0.90],[0.45,0.88],[0.72,0.91]].forEach(([px,py]) => {
    const puddle = gc.createRadialGradient(px*W, py*H, 0, px*W, py*H, 40);
    puddle.addColorStop(0, 'rgba(30,50,80,0.4)');
    puddle.addColorStop(0.5, 'rgba(20,30,50,0.2)');
    puddle.addColorStop(1, 'rgba(0,0,0,0)');
    gc.fillStyle = puddle;
    gc.beginPath();
    gc.ellipse(px*W, py*H, 50, 12, 0, 0, Math.PI*2);
    gc.fill();
  });
  gc.restore();
}

function shadeColor(hex, amt) {
  const n = parseInt(hex.slice(1),16);
  const r = Math.min(255,(n>>16)+amt);
  const g = Math.min(255,((n>>8)&0xff)+amt);
  const b = Math.min(255,(n&0xff)+amt);
  return `rgb(${r},${g},${b})`;
}

function drawTrain() {
  const trainY = H * 0.30;
  const trainH = H * 0.55;
  const trainX = W * 0.01;
  const trainW = W * 0.98;
  const wagonCount = 4;
  const gap = 8;
  const wagonW = (trainW - gap*(wagonCount-1)) / wagonCount;

  // Store for hit testing
  trainRegion = { x: trainX, y: trainY, w: trainW, h: trainH * 0.78 };

  for(let i = 0; i < wagonCount; i++) {
    const wx = trainX + i * (wagonW + gap);
    drawWagon(wx, trainY, wagonW, trainH);
  }

  // Locomotive (first wagon gets a cab)
  drawLocomotive(trainX, trainY, wagonW, trainH);
}

function drawWagon(x, y, w, h) {
  const bodyH = h * 0.76;
  const radius = 10;

  // Drop shadow
  gc.save();
  gc.shadowColor = 'rgba(0,0,0,0.7)';
  gc.shadowBlur = 18;
  gc.shadowOffsetX = 5;
  gc.shadowOffsetY = 8;
  roundRect(gc, x, y, w, bodyH, radius);
  gc.fillStyle = '#000';
  gc.fill();
  gc.restore();

  // Body — metal gradient with side sheen
  gc.save();
  roundRect(gc, x, y, w, bodyH, radius);
  const bodyGrad = gc.createLinearGradient(x, y, x, y+bodyH);
  bodyGrad.addColorStop(0,    '#b0b5be');
  bodyGrad.addColorStop(0.08, '#d8dde6');
  bodyGrad.addColorStop(0.18, '#edf0f5');
  bodyGrad.addColorStop(0.35, '#d5d9e2');
  bodyGrad.addColorStop(0.60, '#c8ccd5');
  bodyGrad.addColorStop(0.85, '#b0b4bc');
  bodyGrad.addColorStop(1,    '#888c94');
  gc.fillStyle = bodyGrad;
  gc.fill();

  // Side sheen highlight
  const sheenGrad = gc.createLinearGradient(x, y, x+w, y);
  sheenGrad.addColorStop(0,   'rgba(255,255,255,0)');
  sheenGrad.addColorStop(0.3, 'rgba(255,255,255,0.08)');
  sheenGrad.addColorStop(0.5, 'rgba(255,255,255,0.14)');
  sheenGrad.addColorStop(0.7, 'rgba(255,255,255,0.06)');
  sheenGrad.addColorStop(1,   'rgba(255,255,255,0)');
  gc.fillStyle = sheenGrad;
  roundRect(gc, x, y, w, bodyH, radius);
  gc.fill();
  gc.restore();

  // Top stripe — dark band
  gc.save();
  gc.beginPath();
  gc.moveTo(x+radius, y);
  gc.lineTo(x+w-radius, y);
  gc.quadraticCurveTo(x+w, y, x+w, y+radius);
  gc.lineTo(x+w, y+10);
  gc.lineTo(x, y+10);
  gc.lineTo(x, y+radius);
  gc.quadraticCurveTo(x, y, x+radius, y);
  gc.closePath();
  gc.fillStyle = '#2a2c32';
  gc.fill();
  gc.restore();

  // Colored accent stripe
  gc.fillStyle = '#1a3a8a';
  gc.fillRect(x+radius, y+10, w-radius*2, 6);

  // Panel lines (horizontal riveted seams)
  gc.strokeStyle = 'rgba(80,85,95,0.5)';
  gc.lineWidth = 1.2;
  [0.38, 0.62].forEach(pct => {
    gc.beginPath();
    gc.moveTo(x+radius, y + bodyH*pct);
    gc.lineTo(x+w-radius, y + bodyH*pct);
    gc.stroke();
  });

  // Vertical panel dividers
  gc.strokeStyle = 'rgba(80,85,95,0.25)';
  gc.lineWidth = 1;
  const panelDivs = Math.floor(w / 60);
  for(let pi = 1; pi < panelDivs; pi++) {
    const px = x + (w / panelDivs) * pi;
    gc.beginPath();
    gc.moveTo(px, y+16);
    gc.lineTo(px, y+bodyH-8);
    gc.stroke();
  }

  // Rivets along top seam
  gc.fillStyle = 'rgba(60,65,75,0.8)';
  for(let rx = x+20; rx < x+w-10; rx += 22) {
    gc.beginPath();
    gc.arc(rx, y+8, 2, 0, Math.PI*2);
    gc.fill();
  }

  // Windows
  const winCount = Math.floor(w / 85);
  const winW = 58;
  const winH = h * 0.20;
  const winY = y + h*0.10;
  const winSpacing = (w - radius*2 - winW*winCount) / (winCount+1);
  for(let wi = 0; wi < winCount; wi++) {
    const wX = x + radius + winSpacing + wi*(winW + winSpacing);
    // Outer frame
    gc.fillStyle = '#1a1c22';
    roundRect(gc, wX-4, winY-4, winW+8, winH+8, 3);
    gc.fill();
    // Inner frame
    gc.fillStyle = '#2a2c32';
    roundRect(gc, wX-2, winY-2, winW+4, winH+4, 2);
    gc.fill();
    // Glass
    const glassGrad = gc.createLinearGradient(wX, winY, wX, winY+winH);
    glassGrad.addColorStop(0,   '#0e1a28');
    glassGrad.addColorStop(0.3, '#162540');
    glassGrad.addColorStop(0.7, '#0e1c32');
    glassGrad.addColorStop(1,   '#080e18');
    gc.fillStyle = glassGrad;
    roundRect(gc, wX, winY, winW, winH, 1);
    gc.fill();
    // Interior glow (faint orange light from inside)
    gc.fillStyle = 'rgba(255,160,60,0.06)';
    gc.fillRect(wX+2, winY+winH*0.4, winW-4, winH*0.5);
    // Reflections
    gc.fillStyle = 'rgba(255,255,255,0.10)';
    gc.fillRect(wX+4, winY+3, winW*0.25, winH*0.35);
    gc.fillStyle = 'rgba(255,255,255,0.05)';
    gc.fillRect(wX+winW*0.6, winY+3, winW*0.15, winH*0.5);
    // Rubber seal
    gc.strokeStyle = 'rgba(30,30,30,0.6)';
    gc.lineWidth = 1.5;
    gc.strokeRect(wX, winY, winW, winH);
  }

  // Door
  const doorW = 36;
  const doorH = bodyH * 0.52;
  const doorX = x + w/2 - doorW/2;
  const doorY = y + bodyH - doorH - 4;
  // Door recess
  gc.fillStyle = '#6a6e76';
  roundRect(gc, doorX-2, doorY-2, doorW+4, doorH+4, 3);
  gc.fill();
  // Door panel
  const doorGrad = gc.createLinearGradient(doorX, doorY, doorX+doorW, doorY);
  doorGrad.addColorStop(0, '#7a7e88');
  doorGrad.addColorStop(0.5, '#909498');
  doorGrad.addColorStop(1, '#6a6e76');
  gc.fillStyle = doorGrad;
  gc.fillRect(doorX, doorY, doorW, doorH);
  // Door gap line (center split for double door)
  gc.strokeStyle = '#555';
  gc.lineWidth = 1.5;
  gc.beginPath();
  gc.moveTo(doorX + doorW/2, doorY);
  gc.lineTo(doorX + doorW/2, doorY + doorH);
  gc.stroke();
  // Door handle
  gc.fillStyle = '#ccc';
  gc.beginPath();
  gc.roundRect(doorX + doorW*0.72, doorY + doorH*0.45, 5, 14, 2);
  gc.fill();
  gc.fillStyle = '#888';
  gc.beginPath();
  gc.roundRect(doorX + doorW*0.28 - 5, doorY + doorH*0.45, 5, 14, 2);
  gc.fill();

  // Rust / weathering streaks
  gc.save();
  gc.globalAlpha = 0.08;
  [[x+w*0.15, y+bodyH*0.25],[x+w*0.45, y+bodyH*0.18],[x+w*0.75, y+bodyH*0.30]].forEach(([sx,sy]) => {
    const rustGrad = gc.createLinearGradient(sx, sy, sx+3, sy+bodyH*0.35);
    rustGrad.addColorStop(0, '#8B4513');
    rustGrad.addColorStop(1, 'transparent');
    gc.fillStyle = rustGrad;
    gc.fillRect(sx, sy, 3, bodyH*0.35);
  });
  gc.restore();

  // Undercarriage frame
  gc.fillStyle = '#111';
  gc.fillRect(x+2, y+bodyH, w-4, h*0.09);
  // Underbody detail
  gc.fillStyle = '#222';
  gc.fillRect(x+10, y+bodyH+2, w-20, h*0.04);

  // Bogie sets
  drawBogieSet(x + w*0.18, y + bodyH + h*0.04, h);
  drawBogieSet(x + w*0.72, y + bodyH + h*0.04, h);
}

function drawBogieSet(cx, cy, trainH) {
  const axleW = 60;
  const wheelR = trainH * 0.08;

  // Axle bar
  gc.fillStyle = '#333';
  gc.fillRect(cx - axleW/2, cy, axleW, 5);

  // Wheels
  [-axleW/2 + wheelR, axleW/2 - wheelR].forEach(dx => {
    const wx = cx + dx;
    const wy = cy + wheelR + 2;

    // Wheel shadow
    gc.fillStyle = 'rgba(0,0,0,0.4)';
    gc.beginPath();
    gc.arc(wx+2, wy+2, wheelR, 0, Math.PI*2);
    gc.fill();

    // Wheel rim
    const rimGrad = gc.createRadialGradient(wx-wheelR*0.3, wy-wheelR*0.3, 1, wx, wy, wheelR);
    rimGrad.addColorStop(0, '#888');
    rimGrad.addColorStop(0.6, '#444');
    rimGrad.addColorStop(1, '#222');
    gc.fillStyle = rimGrad;
    gc.beginPath();
    gc.arc(wx, wy, wheelR, 0, Math.PI*2);
    gc.fill();

    // Hub
    gc.fillStyle = '#666';
    gc.beginPath();
    gc.arc(wx, wy, wheelR*0.35, 0, Math.PI*2);
    gc.fill();
    gc.fillStyle = '#999';
    gc.beginPath();
    gc.arc(wx, wy, wheelR*0.15, 0, Math.PI*2);
    gc.fill();

    // Spokes
    gc.strokeStyle = '#555';
    gc.lineWidth = 2;
    for(let s = 0; s < 6; s++) {
      const angle = (s / 6) * Math.PI * 2;
      gc.beginPath();
      gc.moveTo(wx + Math.cos(angle)*wheelR*0.15, wy + Math.sin(angle)*wheelR*0.15);
      gc.lineTo(wx + Math.cos(angle)*wheelR*0.85, wy + Math.sin(angle)*wheelR*0.85);
      gc.stroke();
    }

    // Rail flange
    gc.fillStyle = '#555';
    gc.beginPath();
    gc.arc(wx, wy, wheelR*1.1, Math.PI*0.3, Math.PI*0.7);
    gc.fill();
  });
}

function drawLocomotive(x, y, w, h) {
  // Cab nose / front shape
  const bodyH = h * 0.78;
  const noseW = 28;

  // Cab overhang
  gc.fillStyle = '#b0b4bc';
  gc.fillRect(x - noseW, y + bodyH*0.3, noseW, bodyH*0.5);

  // Cab face
  gc.strokeStyle = '#666';
  gc.lineWidth = 2;
  gc.strokeRect(x - noseW, y + bodyH*0.3, noseW, bodyH*0.5);

  // Headlight
  const hlY = y + bodyH*0.45;
  gc.save();
  gc.fillStyle = '#ffe060';
  gc.shadowColor = '#ffee88';
  gc.shadowBlur = 15;
  gc.beginPath();
  gc.arc(x - noseW/2, hlY, 8, 0, Math.PI*2);
  gc.fill();
  gc.restore();

  // Stripe on loco
  gc.fillStyle = '#cc2200';
  gc.fillRect(x, y + bodyH*0.62, w*0.6, 8);

  // Number plate
  gc.fillStyle = '#222';
  gc.fillRect(x + 15, y + bodyH*0.72, 55, 18);
  gc.fillStyle = '#ffcc00';
  gc.font = 'bold 12px Courier New';
  gc.textAlign = 'center';
  gc.fillText('5512', x + 42, y + bodyH*0.72 + 13);
}

function drawCharacter() {
  const charX = W * 0.27;
  const charY = H * 0.84;
  const scale = H / 380;

  gc.save();

  // Ground shadow (ellipse)
  const shadowGrad = gc.createRadialGradient(charX, charY, 0, charX, charY, 28*scale);
  shadowGrad.addColorStop(0, 'rgba(0,0,0,0.55)');
  shadowGrad.addColorStop(1, 'rgba(0,0,0,0)');
  gc.fillStyle = shadowGrad;
  gc.beginPath();
  gc.ellipse(charX, charY, 28*scale, 7*scale, 0, 0, Math.PI*2);
  gc.fill();

  // === SHOES ===
  // Left shoe
  gc.fillStyle = '#e8e8e8';
  gc.beginPath();
  gc.roundRect(charX - 16*scale, charY - 9*scale, 14*scale, 9*scale, [3*scale,3*scale,4*scale,4*scale]);
  gc.fill();
  gc.fillStyle = '#cc2200'; // sole stripe
  gc.fillRect(charX - 16*scale, charY - 11*scale, 14*scale, 3*scale);
  gc.fillStyle = '#999';
  gc.fillRect(charX - 15*scale, charY - 7*scale, 12*scale, 1*scale); // lace line
  // Right shoe
  gc.fillStyle = '#e8e8e8';
  gc.beginPath();
  gc.roundRect(charX + 2*scale, charY - 9*scale, 14*scale, 9*scale, [3*scale,3*scale,4*scale,4*scale]);
  gc.fill();
  gc.fillStyle = '#cc2200';
  gc.fillRect(charX + 2*scale, charY - 11*scale, 14*scale, 3*scale);
  gc.fillStyle = '#999';
  gc.fillRect(charX + 3*scale, charY - 7*scale, 12*scale, 1*scale);

  // === LEGS / PANTS (baggy) ===
  // Left leg
  gc.fillStyle = '#1a1c4a';
  gc.beginPath();
  gc.roundRect(charX - 14*scale, charY - 42*scale, 13*scale, 33*scale, 3*scale);
  gc.fill();
  // Right leg
  gc.beginPath();
  gc.roundRect(charX + 1*scale, charY - 42*scale, 13*scale, 33*scale, 3*scale);
  gc.fill();
  // Pant shading
  gc.fillStyle = 'rgba(0,0,30,0.25)';
  gc.fillRect(charX - 3*scale, charY - 42*scale, 6*scale, 33*scale);
  // Pant crease stitch
  gc.strokeStyle = 'rgba(100,100,180,0.3)';
  gc.lineWidth = 1*scale;
  gc.setLineDash([3*scale, 3*scale]);
  gc.beginPath();
  gc.moveTo(charX - 8*scale, charY - 41*scale);
  gc.lineTo(charX - 8*scale, charY - 12*scale);
  gc.stroke();
  gc.beginPath();
  gc.moveTo(charX + 8*scale, charY - 41*scale);
  gc.lineTo(charX + 8*scale, charY - 12*scale);
  gc.stroke();
  gc.setLineDash([]);

  // === BELT ===
  gc.fillStyle = '#1a1a1a';
  gc.fillRect(charX - 14*scale, charY - 44*scale, 28*scale, 5*scale);
  // Belt buckle
  const buckleGrad = gc.createLinearGradient(charX-4*scale, charY-45*scale, charX+4*scale, charY-45*scale);
  buckleGrad.addColorStop(0, '#aaa');
  buckleGrad.addColorStop(0.5, '#eee');
  buckleGrad.addColorStop(1, '#888');
  gc.fillStyle = buckleGrad;
  gc.fillRect(charX - 4*scale, charY - 46*scale, 8*scale, 7*scale);

  // === HOODIE BODY ===
  const hoodieGrad = gc.createLinearGradient(charX - 15*scale, charY - 80*scale, charX + 15*scale, charY - 40*scale);
  hoodieGrad.addColorStop(0, '#2e2e2e');
  hoodieGrad.addColorStop(0.4, '#222');
  hoodieGrad.addColorStop(1, '#1a1a1a');
  gc.fillStyle = hoodieGrad;
  gc.beginPath();
  gc.roundRect(charX - 15*scale, charY - 80*scale, 30*scale, 38*scale, [6*scale, 6*scale, 3*scale, 3*scale]);
  gc.fill();
  // Hoodie fabric fold lines
  gc.strokeStyle = 'rgba(255,255,255,0.05)';
  gc.lineWidth = 1*scale;
  gc.beginPath();
  gc.moveTo(charX - 5*scale, charY - 78*scale);
  gc.lineTo(charX - 8*scale, charY - 44*scale);
  gc.stroke();
  gc.beginPath();
  gc.moveTo(charX + 5*scale, charY - 78*scale);
  gc.lineTo(charX + 8*scale, charY - 44*scale);
  gc.stroke();
  // Center zip line
  gc.strokeStyle = 'rgba(80,80,80,0.6)';
  gc.lineWidth = 1.5*scale;
  gc.beginPath();
  gc.moveTo(charX, charY - 78*scale);
  gc.lineTo(charX, charY - 56*scale);
  gc.stroke();
  // Hoodie pocket
  gc.fillStyle = '#181818';
  gc.beginPath();
  gc.roundRect(charX - 9*scale, charY - 55*scale, 18*scale, 11*scale, 3*scale);
  gc.fill();
  gc.strokeStyle = 'rgba(255,255,255,0.08)';
  gc.lineWidth = 1*scale;
  gc.strokeRect(charX - 9*scale, charY - 55*scale, 18*scale, 11*scale);

  // === ARMS ===
  // Left arm (relaxed, hanging slightly)
  gc.fillStyle = '#222';
  gc.save();
  gc.translate(charX - 15*scale, charY - 76*scale);
  gc.rotate(0.18);
  gc.beginPath();
  gc.roundRect(-6*scale, 0, 11*scale, 28*scale, 4*scale);
  gc.fill();
  gc.restore();
  // Left hand / glove
  gc.fillStyle = '#111';
  gc.beginPath();
  gc.arc(charX - 12*scale, charY - 49*scale, 5*scale, 0, Math.PI*2);
  gc.fill();

  // Right arm (extended, holding can)
  gc.fillStyle = '#222';
  gc.save();
  gc.translate(charX + 15*scale, charY - 76*scale);
  gc.rotate(-0.55);
  gc.beginPath();
  gc.roundRect(-5*scale, 0, 10*scale, 26*scale, 4*scale);
  gc.fill();
  gc.restore();
  // Forearm
  gc.save();
  gc.translate(charX + 28*scale, charY - 60*scale);
  gc.rotate(-0.9);
  gc.beginPath();
  gc.roundRect(-4*scale, 0, 9*scale, 22*scale, 3*scale);
  gc.fill();
  gc.restore();

  // === SPRAY CAN ===
  const canX = charX + 42*scale;
  const canY = charY - 46*scale;
  // Can body with metallic gradient
  const canGrad = gc.createLinearGradient(canX-6*scale, canY, canX+6*scale, canY);
  canGrad.addColorStop(0,   '#990000');
  canGrad.addColorStop(0.3, '#dd2200');
  canGrad.addColorStop(0.55,'#ff4400');
  canGrad.addColorStop(0.75,'#cc2200');
  canGrad.addColorStop(1,   '#880000');
  gc.fillStyle = canGrad;
  gc.beginPath();
  gc.roundRect(canX - 6*scale, canY - 24*scale, 12*scale, 28*scale, 4*scale);
  gc.fill();
  // Can label band
  gc.fillStyle = 'rgba(255,255,255,0.12)';
  gc.fillRect(canX - 6*scale, canY - 14*scale, 12*scale, 6*scale);
  // Can cap
  const capGrad = gc.createLinearGradient(canX-5*scale, canY-28*scale, canX+5*scale, canY-28*scale);
  capGrad.addColorStop(0, '#ccc');
  capGrad.addColorStop(0.5, '#fff');
  capGrad.addColorStop(1, '#aaa');
  gc.fillStyle = capGrad;
  gc.beginPath();
  gc.roundRect(canX - 5*scale, canY - 30*scale, 10*scale, 7*scale, 3*scale);
  gc.fill();
  // Nozzle tip
  gc.fillStyle = '#ccc';
  gc.fillRect(canX + 5*scale, canY - 28*scale, 7*scale, 3*scale);
  gc.fillStyle = '#fff';
  gc.beginPath();
  gc.arc(canX + 12*scale, canY - 27*scale, 2*scale, 0, Math.PI*2);
  gc.fill();

  // Spray burst from nozzle
  gc.save();
  for(let si = 0; si < 3; si++) {
    const bx = canX + (14 + si*6)*scale;
    const by = canY - 27*scale;
    const br = (10 + si*5)*scale;
    const sprayGrad = gc.createRadialGradient(bx, by, 0, bx, by, br);
    sprayGrad.addColorStop(0, `rgba(255,80,20,${0.35 - si*0.08})`);
    sprayGrad.addColorStop(0.5, `rgba(255,120,40,${0.15 - si*0.04})`);
    sprayGrad.addColorStop(1, 'rgba(255,160,60,0)');
    gc.fillStyle = sprayGrad;
    gc.beginPath();
    gc.ellipse(bx, by, br, br*0.7, -0.1, 0, Math.PI*2);
    gc.fill();
  }
  // Fine mist particles
  for(let p = 0; p < 12; p++) {
    const ang = (Math.random() - 0.5) * 0.8 - 0.1;
    const dist = (10 + Math.random() * 22) * scale;
    gc.fillStyle = `rgba(255,${80+Math.random()*80},20,${Math.random()*0.4})`;
    gc.beginPath();
    gc.arc(canX + 12*scale + Math.cos(ang)*dist, canY - 27*scale + Math.sin(ang)*dist, Math.random()*1.5*scale+0.3*scale, 0, Math.PI*2);
    gc.fill();
  }
  gc.restore();

  // Right hand gripping can
  gc.fillStyle = '#111';
  gc.beginPath();
  gc.arc(canX - 2*scale, canY - 16*scale, 6*scale, 0, Math.PI*2);
  gc.fill();

  // === HEAD ===
  // Neck
  gc.fillStyle = '#c09060';
  gc.fillRect(charX - 4*scale, charY - 84*scale, 8*scale, 8*scale);

  // Head shape (slightly oval)
  const faceGrad = gc.createRadialGradient(charX - 3*scale, charY - 90*scale, 2*scale, charX, charY - 88*scale, 16*scale);
  faceGrad.addColorStop(0, '#ddb888');
  faceGrad.addColorStop(0.6, '#c8a070');
  faceGrad.addColorStop(1, '#a07840');
  gc.fillStyle = faceGrad;
  gc.beginPath();
  gc.ellipse(charX, charY - 88*scale, 14*scale, 16*scale, 0, 0, Math.PI*2);
  gc.fill();

  // === BEANIE ===
  gc.fillStyle = '#bb1e00';
  gc.beginPath();
  gc.ellipse(charX, charY - 98*scale, 15*scale, 10*scale, 0, Math.PI, Math.PI*2);
  gc.fill();
  gc.fillRect(charX - 15*scale, charY - 98*scale, 30*scale, 10*scale);
  // Beanie fold line
  gc.fillStyle = '#991500';
  gc.fillRect(charX - 15*scale, charY - 92*scale, 30*scale, 4*scale);
  // Pompom
  const pompGrad = gc.createRadialGradient(charX-1*scale, charY-108*scale, 0, charX, charY-107*scale, 6*scale);
  pompGrad.addColorStop(0, '#ff6644');
  pompGrad.addColorStop(0.6, '#cc2200');
  pompGrad.addColorStop(1, '#991100');
  gc.fillStyle = pompGrad;
  gc.beginPath();
  gc.arc(charX, charY - 107*scale, 6*scale, 0, Math.PI*2);
  gc.fill();

  // === FACE DETAILS ===
  // Eyebrows
  gc.strokeStyle = '#4a3020';
  gc.lineWidth = 2*scale;
  gc.beginPath();
  gc.moveTo(charX - 8*scale, charY - 87*scale);
  gc.lineTo(charX - 3*scale, charY - 89*scale);
  gc.stroke();
  gc.beginPath();
  gc.moveTo(charX + 3*scale, charY - 89*scale);
  gc.lineTo(charX + 8*scale, charY - 87*scale);
  gc.stroke();

  // Eyes — whites + iris + pupil
  gc.fillStyle = '#fff';
  gc.beginPath();
  gc.ellipse(charX - 5*scale, charY - 85*scale, 3.5*scale, 2.5*scale, 0, 0, Math.PI*2);
  gc.fill();
  gc.beginPath();
  gc.ellipse(charX + 5*scale, charY - 85*scale, 3.5*scale, 2.5*scale, 0, 0, Math.PI*2);
  gc.fill();
  gc.fillStyle = '#3a2010';
  gc.beginPath();
  gc.arc(charX - 4.5*scale, charY - 85*scale, 2*scale, 0, Math.PI*2);
  gc.fill();
  gc.beginPath();
  gc.arc(charX + 5.5*scale, charY - 85*scale, 2*scale, 0, Math.PI*2);
  gc.fill();
  gc.fillStyle = '#000';
  gc.beginPath();
  gc.arc(charX - 4.5*scale, charY - 85*scale, 1*scale, 0, Math.PI*2);
  gc.fill();
  gc.beginPath();
  gc.arc(charX + 5.5*scale, charY - 85*scale, 1*scale, 0, Math.PI*2);
  gc.fill();
  // Eye shine
  gc.fillStyle = 'rgba(255,255,255,0.7)';
  gc.beginPath();
  gc.arc(charX - 3.8*scale, charY - 86*scale, 0.8*scale, 0, Math.PI*2);
  gc.fill();
  gc.beginPath();
  gc.arc(charX + 6.2*scale, charY - 86*scale, 0.8*scale, 0, Math.PI*2);
  gc.fill();

  // Mask (balaclava-style)
  const maskGrad = gc.createLinearGradient(charX - 10*scale, charY - 83*scale, charX + 10*scale, charY - 78*scale);
  maskGrad.addColorStop(0, '#2a2a2a');
  maskGrad.addColorStop(0.5, '#383838');
  maskGrad.addColorStop(1, '#1e1e1e');
  gc.fillStyle = maskGrad;
  gc.beginPath();
  gc.roundRect(charX - 10*scale, charY - 83*scale, 20*scale, 10*scale, [2*scale, 2*scale, 5*scale, 5*scale]);
  gc.fill();
  // Mask stitching
  gc.strokeStyle = 'rgba(255,255,255,0.08)';
  gc.lineWidth = 0.8*scale;
  gc.beginPath();
  gc.moveTo(charX - 9*scale, charY - 80*scale);
  gc.lineTo(charX + 9*scale, charY - 80*scale);
  gc.stroke();

  // Ear
  gc.fillStyle = '#c09060';
  gc.beginPath();
  gc.ellipse(charX - 14*scale, charY - 87*scale, 3*scale, 4*scale, 0.2, 0, Math.PI*2);
  gc.fill();

  gc.restore();
}

function drawUI() {
  uc.clearRect(0, 0, W, H);

  // Bottom hint bar
  const barH = 36;
  uc.fillStyle = 'rgba(0,0,0,0.7)';
  uc.fillRect(0, H - barH, W, barH);

  uc.fillStyle = 'rgba(233,69,96,0.9)';
  uc.font = 'bold 13px Courier New';
  uc.textAlign = 'left';
  uc.fillText('Ä = Farbmenü öffnen', 14, H - barH/2 + 5);

  // Color indicator
  const indX = W - 80;
  const indY = H - barH/2;
  uc.strokeStyle = '#fff';
  uc.lineWidth = 2;
  uc.beginPath();
  uc.arc(indX, indY, 12, 0, Math.PI*2);
  uc.stroke();
  uc.fillStyle = tool === 'eraser' ? '#333' : selectedColor;
  uc.beginPath();
  uc.arc(indX, indY, 10, 0, Math.PI*2);
  uc.fill();

  uc.fillStyle = 'rgba(255,255,255,0.5)';
  uc.font = '10px Courier New';
  uc.textAlign = 'right';
  uc.fillText(tool === 'eraser' ? 'RADIERER' : 'SPRAY', W - 20, H - barH/2 + 4);

  // Brush size indicator (small circle near bottom right)
  uc.strokeStyle = 'rgba(255,255,255,0.2)';
  uc.lineWidth = 1;
  uc.beginPath();
  uc.arc(W - 130, H - barH/2, brushSize/2 * 0.5 + 3, 0, Math.PI*2);
  uc.stroke();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function isOnTrain(x, y) {
  return x >= trainRegion.x && x <= trainRegion.x + trainRegion.w &&
         y >= trainRegion.y && y <= trainRegion.y + trainRegion.h;
}

function sprayPaint(x, y) {
  if(!isOnTrain(x, y)) return;

  if(tool === 'eraser') {
    pc.save();
    pc.globalCompositeOperation = 'destination-out';
    const eraserGrad = pc.createRadialGradient(x, y, 0, x, y, brushSize);
    eraserGrad.addColorStop(0, 'rgba(0,0,0,1)');
    eraserGrad.addColorStop(0.5, 'rgba(0,0,0,0.8)');
    eraserGrad.addColorStop(1, 'rgba(0,0,0,0)');
    pc.fillStyle = eraserGrad;
    pc.beginPath();
    pc.arc(x, y, brushSize, 0, Math.PI*2);
    pc.fill();
    pc.restore();
    return;
  }

  // Parse color
  const hex = selectedColor;
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);

  // Main spray blob
  pc.save();
  const grad = pc.createRadialGradient(x, y, 0, x, y, brushSize);
  grad.addColorStop(0, `rgba(${r},${g},${b},${paintOpacity})`);
  grad.addColorStop(0.4, `rgba(${r},${g},${b},${paintOpacity*0.6})`);
  grad.addColorStop(0.75, `rgba(${r},${g},${b},${paintOpacity*0.2})`);
  grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
  pc.fillStyle = grad;
  pc.beginPath();
  pc.arc(x, y, brushSize, 0, Math.PI*2);
  pc.fill();

  // Scatter dots (spray effect)
  const dotCount = Math.floor(brushSize * 0.8);
  for(let i = 0; i < dotCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * brushSize * 1.2;
    const dx = x + Math.cos(angle) * dist;
    const dy = y + Math.sin(angle) * dist;
    if(!isOnTrain(dx, dy)) continue;
    const alpha = Math.random() * paintOpacity * 0.5;
    const dsize = Math.random() * 2.5 + 0.5;
    pc.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    pc.beginPath();
    pc.arc(dx, dy, dsize, 0, Math.PI*2);
    pc.fill();
  }
  pc.restore();
}

// Input
paintCanvas.style.pointerEvents = 'auto';

paintCanvas.addEventListener('mousedown', e => {
  if(menuOpen) return;
  isDrawing = true;
  sprayPaint(e.clientX, e.clientY);
});
paintCanvas.addEventListener('mousemove', e => {
  if(!isDrawing || menuOpen) return;
  sprayPaint(e.clientX, e.clientY);
});
paintCanvas.addEventListener('mouseup', () => { isDrawing = false; });
paintCanvas.addEventListener('mouseleave', () => { isDrawing = false; });

// Touch support
paintCanvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if(menuOpen) return;
  isDrawing = true;
  const t = e.touches[0];
  sprayPaint(t.clientX, t.clientY);
}, {passive:false});
paintCanvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if(!isDrawing || menuOpen) return;
  const t = e.touches[0];
  sprayPaint(t.clientX, t.clientY);
}, {passive:false});
paintCanvas.addEventListener('touchend', () => { isDrawing = false; });

document.addEventListener('keydown', e => {
  if(e.key === 'Ä' || e.key === 'ä' || e.keyCode === 196 || e.keyCode === 228) {
    toggleMenu();
    e.preventDefault();
  }
  if(e.key === 'Escape' && menuOpen) {
    toggleMenu();
  }
});

// Initial render
function render() {
  gc.clearRect(0, 0, W, H);
  drawBackground();
  drawTrain();
  drawCharacter();
  drawUI();
}

// Resize handler
window.addEventListener('resize', () => {
  W = window.innerWidth;
  H = window.innerHeight;
  gameCanvas.width = uiCanvas.width = W;
  gameCanvas.height = uiCanvas.height = H;
  // Keep paint canvas but resize (this clears it — a tradeoff)
  // To preserve: copy to temp, resize, restore
  const tmp = document.createElement('canvas');
  tmp.width = paintCanvas.width;
  tmp.height = paintCanvas.height;
  tmp.getContext('2d').drawImage(paintCanvas, 0, 0);
  paintCanvas.width = W;
  paintCanvas.height = H;
  pc.drawImage(tmp, 0, 0);
  render();
});

render();
</script>
</body>
</html>
